  const DFS_REC = `
def dfs(graph, start):
    visited, order = set(), []      #@init

    def visit(node):
        visited.add(node)           # mark on entry  #@mark
        order.append(node)          #@visit
        for nei in graph[node]:     #@for
            if nei not in visited:  #@check
                visit(nei)          # go deeper first  #@recurse

    visit(start)                    #@start
    return order                    #@done

${pyGraph(GB.adj)}
dfs(graph, 'A')   # ['A', 'B', 'D', 'F', 'G', 'E', 'C']  #@call
`;

  function traceDFSRec() {
    const g = GB, adj = g.adj, start = 'A';
    const t = DSA.tracer();
    const visited = new Set(), order = [], stack = [], finished = new Set(), tree = {};
    let nei, act = null;
    const step = (line, msg) => {
      const ns = {};
      visited.forEach((u) => (ns[u] = finished.has(u) ? 'done' : 'frontier'));
      const node = stack[stack.length - 1];
      if (node) ns[node] = 'active';
      const es = Object.assign({}, tree);
      if (act) es[act] = 'active';
      t.step(line, msg, {
        view: gview(g, { ns, es, ptr: ptrs([[node, 'node'], [nei, 'nei']]) }),
        vars: vars({ node, nei, order: order.slice() }),
        aux: [
          { label: 'call stack', kind: 'stack', items: stack.map((u, i) => ({ v: `visit('${u}')`, s: i === stack.length - 1 ? 'active' : null })) },
          { label: 'order', kind: 'list', items: order.slice() },
        ],
      });
    };
    const visit = (node) => {
      stack.push(node); nei = undefined; act = null;
      visited.add(node); order.push(node);
      step(['mark', 'visit'], `Enter \`visit('${node}')\`: mark ${q(node)} and add it to \`order\`.`);
      for (const n of adj[node]) {
        nei = n; act = ek(g, node, n);
        if (visited.has(n)) {
          step('check', `${q(n)} is already visited, skip.`);
        } else {
          tree[ek(g, node, n)] = 'tree';
          step(['check', 'recurse'], `${q(n)} is new: call \`visit('${n}')\` now. ${q(node)} waits on the call stack.`);
          visit(n);
          nei = n; act = null;
        }
      }
      nei = undefined; act = null;
      const caller = stack[stack.length - 2];
      step('for', caller ? `${q(node)} has no neighbours left. Return to \`visit('${caller}')\`.` : `${q(node)} has no neighbours left. The first call returns.`);
      finished.add(node); stack.pop();
    };
    step('call', 'Call `dfs(graph, \'A\')`. DFS goes as deep as it can before backing up.');
    step('init', 'Empty `visited` set and `order` list. The nested `visit` shares them.');
    step('start', `Start the search: \`visit('${start}')\`.`);
    visit(start);
    t.step('done', `Return ${list(order)}. Each branch was followed to its end before trying the next one.`, {
      view: gview(g, { ns: Object.fromEntries(order.map((u) => [u, 'done'])), es: tree }),
      vars: { order: order.slice(), return: order.slice() },
      aux: [{ label: 'call stack', kind: 'stack', items: [] }, { label: 'order', kind: 'list', items: order.slice() }],
    });
    return t.frames;
  }

  const DFS_IT = `
def dfs(graph, start):
    visited, order = set(), []      #@init
    stack = [start]                 # LIFO: list end is the top  #@initq
    while stack:                    #@loop
        node = stack.pop()          # newest first  #@pop
        if node in visited:         # pushed twice: skip  #@seen
            continue
        visited.add(node)           # mark when popped  #@mark
        order.append(node)          #@visit
        # reversed, so the smallest neighbour ends on top
        for nei in reversed(graph[node]):
            if nei not in visited:  #@check
                stack.append(nei)   #@push
    return order                    #@done

${pyGraph(GB.adj)}
dfs(graph, 'A')   # ['A', 'B', 'D', 'F', 'G', 'E', 'C']  #@call
`;

  function traceDFSIt() {
    const g = GB, adj = g.adj, start = 'A';
    const t = DSA.tracer();
    const visited = new Set(), order = [], stack = [], tree = {}, via = {};
    let node, nei, act = null;
    const step = (line, msg) => {
      const ns = {};
      stack.forEach((u) => { if (!visited.has(u)) ns[u] = 'frontier'; });
      visited.forEach((u) => (ns[u] = 'visited'));
      if (node) ns[node] = 'active';
      const es = Object.assign({}, tree);
      if (act) es[act] = 'active';
      t.step(line, msg, {
        view: gview(g, { ns, es, ptr: ptrs([[node, 'node'], [nei, 'nei']]) }),

        aux: [

          { label: 'visited', kind: 'set', items: [...visited] },
        ],
      });
    };
    step('call', 'Call `dfs(graph, \'A\')`. Same idea as recursion, but with our own stack.');
    stack.push(start);
    step(['init', 'initq'], `Stack starts with ${q(start)}. \`list.append\` / \`list.pop\` are both O(1) at the end.`);
    for (;;) {
      step('loop', stack.length ? `Stack: ${list(stack)} (top is the right end).` : 'The stack is empty: done.');
      if (!stack.length) break;

      if (visited.has(node)) {
        step(['pop', 'seen'], `Pop ${q(node)}. It was pushed twice and is already visited, so skip it.`);
        node = undefined;
        continue;
      }
      step(['pop', 'seen'], `Pop ${q(node)} from the top. Not visited yet.`);
      visited.add(node); order.push(node);

        if (visited.has(n)) step('check', `${q(n)} is already visited, skip.`);
        else {
          stack.push(n); via[n] = node;
          step(['check', 'push'], `${q(n)} is not visited: push it. Stack: ${list(stack)}.`);
        }
      }
      nei = undefined; act = null;
    }
    node = undefined;
    t.step('done', `Return ${list(order)}: the same order as the recursive version, thanks to \`reversed\`.`, {
      view: gview(g, { ns: Object.fromEntries(order.map((u) => [u, 'visited'])), es: tree }),
      vars: { start, order: order.slice(), return: order.slice() },
      aux: [{ label: 'stack', kind: 'stack', items: [] }, { label: 'visited', kind: 'set', items: [...visited] }],
    });
    return t.frames;
  }

from collections import deque

def num_islands(grid):
    rows, cols = len(grid), len(grid[0])
    count = 0                       #@init

    def bfs(r, c):
        grid[r][c] = '#'            # mark visited in place  #@seed
        queue = deque([(r, c)])
        while queue:                #@while
            i, j = queue.popleft()  #@pop
            for di, dj in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                x, y = i + di, j + dj   # 4 neighbours
                if (0 <= x < rows and 0 <= y < cols  #@check
                        and grid[x][y] == '1'):  #@check2
                    # land in the same island: mark and queue
                    grid[x][y] = '#'  #@mark
                    queue.append((x, y))  #@push

    for r in range(rows):
        for c in range(cols):
            if grid[r][c] == '1':   # land not seen yet  #@scan
                count += 1          # a new island  #@count
                bfs(r, c)           # mark all of it  #@call2
    return count                    #@done

${GRID_PY}
`;

  function traceIslandsBFS() {
    const s = islandState();
    const t = DSA.tracer();
    let count, r, c, i, j, x, y;
    const step = (line, msg) => t.step(line, msg, {
      view: s.view(),
      vars: vars({ count, r, c, i, j, x, y }),
      aux: [{ label: 'queue', kind: 'queue', items: s.queue.map(([a, b]) => cellStr(a, b)) }],
    });
    step('callg', "Call `num_islands(grid)`. `'1'` is land, `'0'` is water. Islands connect up, down, left and right.");
    count = 0;
    step('init', `rows = ${s.rows}, cols = ${s.cols}, count = 0.`);
    for (r = 0; r < s.rows; r++) {
      for (c = 0; c < s.cols; c++) {
        s.cursor = [r, c]; s.cur = null; s.probe = [r, c];
        const v = s.grid[r][c];
        if (v !== '1') {
          step('scan', `grid[${r}][${c}] is '${v}': ${v === '0' ? 'water' : 'already marked as part of an island'}. Skip.`);
          continue;
        }
        s.probe = [r, c];
        step('scan', `grid[${r}][${c}] is '1': unseen land, so a new island starts here.`);
        count++;
        step('count', `count = ${count}. Now mark the whole island so none of it is counted again.`);
        s.probe = null;
        s.grid[r][c] = '#'; s.island.add(r + ',' + c); s.queue = [[r, c]];
        step('seed', `\`bfs(${r}, ${c})\`: set the cell to '#' (visited) and queue it.`);
        for (;;) {
          i = j = x = y = undefined;
          if (!s.queue.length) break;
          [i, j] = s.queue.shift(); s.cur = [i, j];
          step('pop', `Pop ${cellStr(i, j)}. Check its 4 neighbours: down, up, right, left.`);
          for (const [di, dj, name] of DIRS) {
            x = i + di; y = j + dj; s.probe = [x, y];
            const inb = x >= 0 && x < s.rows && y >= 0 && y < s.cols;
            if (!inb) { step(['check', 'check2'], `${name}: ${cellStr(x, y)} is off the grid.`); continue; }
            const g = s.grid[x][y];
            if (g !== '1') { step(['check', 'check2'], `${name}: ${cellStr(x, y)} is '${g}': ${g === '0' ? 'water' : 'already marked'}.`); continue; }
            step(['check', 'check2'], `${name}: ${cellStr(x, y)} is '1': land touching this island.`);

def num_islands(grid):
    rows, cols = len(grid), len(grid[0])

    def dfs(i, j):
        if not (0 <= i < rows and 0 <= j < cols):  #@oob
            return                  # off the grid
        if grid[i][j] != '1':       #@water
            return                  # water or already seen
        grid[i][j] = '#'            # mark visited in place  #@mark
        dfs(i + 1, j)               # down
        dfs(i - 1, j)               # up
        dfs(i, j + 1)               # right
        dfs(i, j - 1)               # left

    count = 0                       #@init
    for r in range(rows):
        for c in range(cols):
            if grid[r][c] == '1':   # land not seen yet  #@scan
                count += 1          # a new island  #@count
                dfs(r, c)           # sink all of it  #@call2
    return count                    #@done

${GRID_PY}
`;

      // calls that got past the checks: deepest one is current, the rest wait
      const land = calls.filter((x) => x[2]);
      s.onStack = land.slice(0, -1);
      s.cur = land.length ? land[land.length - 1] : null;
      t.step(line, msg, {
        view: s.view(),
        vars: vars(Object.assign({ count, r, c }, top ? { i: top[0], j: top[1] } : {}, extra || {})),
        aux: [{ label: 'call stack', kind: 'stack', items: calls.map(([a, b], k) => ({ v: `dfs(${a}, ${b})`, s: k === calls.length - 1 ? 'active' : null })) }],
      });
    };
    const dfs = (i, j, name) => {
      calls.push([i, j, false]);
      const pre = name ? `${name}: ` : '';
      if (!(i >= 0 && i < s.rows && j >= 0 && j < s.cols)) {
        s.probe = null;
        step('oob', `${pre}\`dfs(${i}, ${j})\` is off the grid. Return.`);
        calls.pop(); return;
      }
      const g = s.grid[i][j];
      if (g !== '1') {
        s.probe = [i, j];
        step('water', `${pre}\`dfs(${i}, ${j})\` finds '${g}' (${g === '0' ? 'water' : 'already marked'}). Return.`);
        s.probe = null;
        calls.pop(); return;
      }
      s.grid[i][j] = '#'; s.island.add(i + ',' + j); s.probe = null;
      calls[calls.length - 1][2] = true;
      step('mark', `${pre}\`dfs(${i}, ${j})\` is land. Mark it '#', then try down, up, right, left.`);
      for (const [di, dj, nm] of DIRS) {
        dfs(i + di, j + dj, nm);
      }
      calls.pop();
    };
    step('callg', "Call `num_islands(grid)`. `'1'` is land, `'0'` is water. Islands connect up, down, left and right.");
    count = 0;
    step('init', 'count = 0. Scan the grid row by row.');
    for (r = 0; r < s.rows; r++) {
      for (c = 0; c < s.cols; c++) {
        s.cursor = [r, c]; s.cur = null; s.probe = [r, c];
        const v = s.grid[r][c];
        if (v !== '1') {
          step('scan', `grid[${r}][${c}] is '${v}': ${v === '0' ? 'water' : 'already part of a counted island'}. Skip.`);
          continue;
        }
        s.probe = [r, c];
        step('scan', `grid[${r}][${c}] is '1': unseen land, a new island.`);
        count++;
        step('count', `count = ${count}. Now sink the whole island with DFS.`);
        s.probe = null;
        dfs(r, c, null);
        s.cur = null; s.onStack = [];
        s.island.forEach((k) => s.done.add(k));
        const n = s.island.size; s.island.clear();
        step('call2', `\`dfs(${r}, ${c})\` returned: island ${count} is fully marked (${n} cell${n > 1 ? 's' : ''}).`);
      }
    }
    s.cursor = null; r = c = undefined;
    t.step('done', `Return ${count}. Every cell is visited at most twice (scan + DFS), so O(rows × cols).`, {
      view: s.view(), vars: { count, return: count },
    });
    return t.frames;
  }

  /* ================= Topological sort ================= */

  const KAHN = `
from collections import deque

def topo_sort(graph):
    indeg = {u: 0 for u in graph}   #@indeg0
    for u in graph:
        for v in graph[u]:
            indeg[v] += 1           # one more prerequisite  #@count
    # nodes with no prerequisites can go first
    queue = deque(u for u in graph if indeg[u] == 0)  #@queue
    order = []
    while queue:                    #@loop
        u = queue.popleft()         #@pop
        order.append(u)             #@out
        for v in graph[u]:
            indeg[v] -= 1           # u is done: drop u -> v  #@dec
            if indeg[v] == 0:       # all prerequisites done  #@zero
                queue.append(v)     #@push
    # fewer than n nodes out: a cycle blocked the rest
    if len(order) < len(graph):     #@len
        return []
    return order                    #@done

${pyGraph(GD.adj)}
topo_sort(graph)   # ['A', 'B', 'C', 'D', 'E', 'F']  #@call
`;

  function traceKahn() {
    const g = GD, adj = g.adj, nodes = Object.keys(adj);
    const t = DSA.tracer();
    const indeg = {}, queue = [], order = [], gone = {};
    let u, v, act = null;
    const step = (line, msg) => {
      const ns = {};
      queue.forEach((x) => (ns[x] = 'frontier'));
      order.forEach((x) => (ns[x] = 'done'));
      if (u) ns[u] = 'active';
      if (v && act) ns[v] = ns[v] || 'compare';
      const es = Object.assign({}, gone);
      if (act) es[act] = 'active';
      t.step(line, msg, {
        view: gview(g, { ns, es, badges: Object.assign({}, indeg), ptr: ptrs([[u, 'u'], [v, 'v']]) }),
        vars: vars({ u, v, indeg: Object.keys(indeg).length ? Object.assign({}, indeg) : undefined, order: order.slice() }),
        aux: [{ label: 'queue', kind: 'queue', items: queue.slice() }, { label: 'order', kind: 'list', items: order.slice() }],
      });
    };
    step('call', 'Call `topo_sort(graph)`. An edge `u -> v` means "u must come before v" (like a course prerequisite).');
    nodes.forEach((x) => (indeg[x] = 0));
    step('indeg0', 'Every node starts with in-degree 0. The badges show `indeg`.');
    for (const a of nodes) {
      for (const b of adj[a]) {
        act = ek(g, a, b); indeg[b]++;
        step('count', `Edge ${a} → ${b}: \`indeg['${b}']\` becomes ${indeg[b]}.`);
      }
    }
    act = null;
    nodes.forEach((x) => { if (indeg[x] === 0) queue.push(x); });
    step('queue', `${list(queue)} have in-degree 0: nothing must come before them. Queue them.`);
    for (;;) {
      u = undefined; v = undefined;
      step('loop', queue.length ? `Queue: ${list(queue)}.` : 'Queue is empty.');
      if (!queue.length) break;
      u = queue.shift(); order.push(u);
      step(['pop', 'out'], `Pop ${q(u)} and add it to \`order\`. Everything it depends on is already placed.`);
      for (const b of adj[u]) {
        v = b; act = ek(g, u, b); indeg[b]--;
        const z = indeg[b] === 0;
        step(['dec', 'zero'], `Remove edge ${u} → ${b}: \`indeg['${b}']\` = ${indeg[b]}. ${z ? 'Zero, so it is ready.' : 'Still waiting on another node.'}`);
        gone[act] = 'dim';
        if (z) {
          queue.push(b); act = null;
          step('push', `Queue ${q(b)}.`);
        }
      }
      act = null; v = undefined;
    }
    step('len', `\`len(order)\` = ${order.length} = number of nodes, so there is no cycle.`);
    t.step('done', `Return ${list(order)}. Every edge points from left to right in this order.`, {
      view: gview(g, { ns: Object.fromEntries(nodes.map((x) => [x, 'done'])), badges: Object.fromEntries(order.map((x, k) => [x, '#' + (k + 1)])) }),
      vars: { order: order.slice(), return: order.slice() },
      aux: [{ label: 'order', kind: 'list', items: order.slice() }],
    });
    return t.frames;
  }

  const TOPO_DFS = `
def topo_sort(graph):
    visited, post = set(), []       #@init

    def dfs(u):
        visited.add(u)              #@mark
        for v in graph[u]:
            if v not in visited:    #@check
                dfs(v)              #@recurse
        post.append(u)              # after all it points to  #@post

    for u in graph:                 # cover every component  #@outer
        if u not in visited:
            dfs(u)                  #@call2
    return post[::-1]               # reverse post-order  #@done

${pyGraph(GD.adj)}
topo_sort(graph)   # ['B', 'D', 'A', 'C', 'E', 'F']  #@call
`;

  function traceTopoDFS() {
    const g = GD, adj = g.adj, nodes = Object.keys(adj);
    const t = DSA.tracer();
    const visited = new Set(), post = [], stack = [], tree = {};
    let v, act = null, outerU;
    const step = (line, msg) => {
      const ns = {};
      visited.forEach((x) => (ns[x] = post.includes(x) ? 'done' : 'frontier'));
      const u = stack[stack.length - 1];
      if (u) ns[u] = 'active';
      const es = Object.assign({}, tree);
      if (act) es[act] = 'active';
      t.step(line, msg, {
        view: gview(g, { ns, es, ptr: ptrs([[u || outerU, 'u'], [v, 'v']]) }),
        vars: vars({ u: u || outerU, v, post: post.slice() }),
        aux: [
          { label: 'call stack', kind: 'stack', items: stack.map((x, i) => ({ v: `dfs('${x}')`, s: i === stack.length - 1 ? 'active' : null })) },
          { label: 'post', kind: 'list', items: post.slice() },
        ],
      });
    };
    const dfs = (u) => {
      stack.push(u); v = undefined; act = null;
      visited.add(u);
      step('mark', `Enter \`dfs('${u}')\`: mark ${q(u)} visited.`);
      for (const b of adj[u]) {
        v = b; act = ek(g, u, b);
        if (visited.has(b)) step('check', `${q(b)} is already visited. ${post.includes(b) ? 'It is already in `post`.' : ''}`);
        else {
          tree[act] = 'tree';
          step(['check', 'recurse'], `${q(b)} is not visited: \`dfs('${b}')\`.`);
          dfs(b);
          v = b; act = null;
        }
      }
      v = undefined; act = null;
      post.push(u);
      step('post', `All of ${q(u)}'s successors are finished, so append ${q(u)}: post = ${list(post)}.`);
      stack.pop();
    };
    step('call', 'Call `topo_sort(graph)`. Idea: a node is finished only after everything it points to, so reversed finish order is a valid order.');
    step('init', 'Empty `visited` set and `post` list.');
    for (const u of nodes) {
      outerU = u;
      if (visited.has(u)) { step('outer', `${q(u)} is already visited, skip.`); continue; }
      step('outer', `${q(u)} is not visited yet.`);
      step('call2', `Start \`dfs('${u}')\`.`);
      dfs(u);
    }
    outerU = undefined;
    const res = post.slice().reverse();
    t.step('done', `\`post\` = ${list(post)}. Reversed: ${list(res)}. Every edge points left to right.`, {
      view: gview(g, { ns: Object.fromEntries(nodes.map((x) => [x, 'done'])), es: tree, badges: Object.fromEntries(res.map((x, k) => [x, '#' + (k + 1)])) }),
      vars: { post: post.slice(), return: res },
      aux: [{ label: 'post', kind: 'list', items: post.slice() }, { label: 'result', kind: 'list', items: res }],
    });
    return t.frames;
  }

  const DIJ = `
import heapq

def dijkstra(graph, src):
    dist = {u: float('inf') for u in graph}  #@init
    dist[src] = 0                   #@init2
    heap = [(0, src)]               # (distance, node)  #@heap
    while heap:                     #@loop
        d, u = heapq.heappop(heap)  # closest first  #@pop
        if d > dist[u]:             # stale entry: skip  #@stale
            continue
        for v, w in graph[u]:
            nd = d + w              # path through u  #@nd
            if nd < dist[v]:        # shorter: update  #@cmp
                dist[v] = nd        #@relax
                heapq.heappush(heap, (nd, v))  #@push
    return dist                     #@done

${pyGraph(GW.adj)}
dijkstra(graph, 'A')
# {'A': 0, 'B': 3, 'C': 2, 'D': 8, 'E': 10, 'F': 13}  #@call
`;

  function traceDijkstra() {
    const g = GW, adj = g.adj, nodes = Object.keys(adj), src = 'A';
    const t = DSA.tracer();
    const dist = {}, heap = [], settled = new Set(), par = {};
    let d, u, v, w, nd, act = null, kvS = {}, stale = false;
    const step = (line, msg) => {
      const ns = {};
      heap.forEach(([, x]) => { if (!settled.has(x)) ns[x] = 'frontier'; });
      settled.forEach((x) => (ns[x] = 'visited'));
      if (v && act) ns[v] = 'compare';
      if (u) ns[u] = stale ? 'bad' : 'active';
      const es = {};
      Object.keys(par).forEach((x) => (es[ek(g, par[x], x)] = 'tree'));
      if (act) es[act] = 'active';
      t.step(line, msg, {
        views: [
          gview(g, { ns, es, badges: infMap(dist), ptr: ptrs([[u, 'u'], [v, 'v']]) }),
          { type: 'kv', title: 'dist', entries: nodes.filter((x) => x in dist).map((x) => [x, inf(dist[x])]), states: kvS },
        ],
        vars: vars({ src, d, u, v, w, nd }),
        aux: [heapAux(heap)],
      });
    };
    step('call', 'Call `dijkstra(graph, \'A\')`. Each neighbour comes as `(node, weight)`. All weights must be ≥ 0.');
    nodes.forEach((x) => (dist[x] = Infinity)); dist[src] = 0; heap.push([0, src]); kvS = { [src]: 'new' };
    step(['init', 'init2', 'heap'], `Every distance starts at inf, except \`dist['${src}'] = 0\`. The heap holds \`(distance, node)\` pairs, smallest first.`);
    for (;;) {
      kvS = {}; u = undefined; d = undefined; stale = false;
      step('loop', heap.length ? `Heap has ${heap.length} entr${heap.length > 1 ? 'ies' : 'y'}. The smallest is on top.` : 'Heap is empty: every reachable node is settled.');
      if (!heap.length) break;
      [d, u] = hpop(heap);
      if (d > dist[u]) {
        stale = true;
        step(['pop', 'stale'], `Pop ${tup(d, u)}. But \`dist['${u}']\` is already ${dist[u]} < ${d}: this is an old entry. Skip it.`);
        continue;
      }
      settled.add(u); kvS = { [u]: 'visited' };
      step(['pop', 'stale'], `Pop ${tup(d, u)}: the closest unsettled node. ${d} == \`dist['${u}']\`, so ${q(u)} is final.`);
      for (const [b, wt] of adj[u]) {
        v = b; w = wt; nd = d + wt; act = ek(g, u, b); kvS = { [b]: 'compare' };
        const better = nd < dist[b];
        step(['nd', 'cmp'], `Edge ${u}–${b} (w=${wt}): nd = ${d} + ${wt} = ${nd}. ${better ? `${nd} < ${f(dist[b])}: shorter!` : `Not less than ${f(dist[b])}, no change.`}`);
        if (better) {
          dist[b] = nd; par[b] = u; hpush(heap, [nd, b]); kvS = { [b]: 'new' };
          step(['relax', 'push'], `\`dist['${b}'] = ${nd}\` and push ${tup(nd, b)}. Any older entry for ${q(b)} stays in the heap and is skipped later.`);
        }
      }
      v = w = nd = undefined; act = null;
    }
    const es = {};
    Object.keys(par).forEach((x) => (es[ek(g, par[x], x)] = 'tree'));
    t.step('done', `Return \`dist\`. The dark edges form the shortest-path tree from ${q(src)}.`, {
      views: [
        gview(g, { ns: Object.fromEntries(nodes.map((x) => [x, 'visited'])), es, badges: infMap(dist) }),
        { type: 'kv', title: 'dist', entries: nodes.map((x) => [x, inf(dist[x])]), states: {} },
      ],
      vars: { src, return: Object.assign({}, dist) },
      aux: [heapAux(heap)],
    });
    return t.frames;
  }

  const BF = `
def bellman_ford(graph, src):
    dist = {u: float('inf') for u in graph}  #@init
    dist[src] = 0                   #@init2
    # a shortest path has at most V-1 edges
    for i in range(len(graph) - 1):  #@round
        for u in graph:
            for v, w in graph[u]:   # every edge u -> v
                if dist[u] + w < dist[v]:  #@cmp
                    dist[v] = dist[u] + w  # relax  #@relax
    # one more pass: still improving = negative cycle
    for u in graph:
        for v, w in graph[u]:
            if dist[u] + w < dist[v]:  #@neg
                return None         # negative cycle
    return dist                     #@done

${pyGraph(GBF.adj)}
bellman_ford(graph, 'S')
# {'S': 0, 'A': 1, 'B': 4, 'C': 3, 'D': 4}  #@call

def floyd_warshall(graph):
    nodes = list(graph)
    idx = {u: i for i, u in enumerate(nodes)}
    n, INF = len(nodes), float('inf')
    dist = [[INF] * n for _ in range(n)]
    for u in graph:
        dist[idx[u]][idx[u]] = 0    # zero to itself
        for v, w in graph[u]:
            dist[idx[u]][idx[v]] = w  # direct edge  #@build
    # allow k as a stop on the way from i to j
    for k in range(n):              #@k
        for i in range(n):
            for j in range(n):
                through_k = dist[i][k] + dist[k][j]  #@via
                if through_k < dist[i][j]:  #@cmp
                    dist[i][j] = through_k  #@relax
    return dist                     #@done

floyd_warshall(graph)   # all-pairs distances  #@call

  const KRUSKAL = `
def kruskal(graph):
    parent = {u: u for u in graph}  # every node alone  #@init

    def find(x):                    # root of x's set
        while parent[x] != x:
            parent[x] = parent[parent[x]]  # path halving
            x = parent[x]
        return x

    # each undirected edge once, cheapest first
    edges = sorted((w, u, v) for u in graph  #@sort
                   for v, w in graph[u] if u < v)  #@sort2
    mst, total = [], 0
    for w, u, v in edges:           #@for
        ru, rv = find(u), find(v)   #@find
        if ru == rv:                # same tree: a cycle  #@same
            continue
        parent[ru] = rv             # union the two sets  #@union
        mst.append((u, v, w))       #@take
        total += w
        if len(mst) == len(graph) - 1:  #@full
            break                   # V-1 edges: done
    return mst, total               #@done

${pyGraph(GW.adj)}
kruskal(graph)   # 5 edges, total 13  #@call
`;

  function traceKruskal() {
    const g = GW, adj = g.adj, nodes = Object.keys(adj);
    const t = DSA.tracer();
    const parent = {};
    const edges = [];
    nodes.forEach((a) => adj[a].forEach(([b, w]) => { if (a < b) edges.push([w, a, b]); }));
    edges.sort((x, y) => (lt(x, y) ? -1 : lt(y, x) ? 1 : 0));
    const est = {}; // edge index -> state
    const mst = [];
    let total, w, u, v, ru, rv, cur = -1, kvS = {}, sorted = false;
    const find = (x) => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
    const step = (line, msg) => {
      const ns = {}, es = {};
      mst.forEach(([a, b]) => { ns[a] = 'visited'; ns[b] = 'visited'; es[ek(g, a, b)] = 'tree'; });
      Object.keys(est).forEach((k) => { if (est[k] === 'bad') es[ek(g, edges[k][1], edges[k][2])] = 'bad'; });
      if (cur >= 0 && !est[cur]) { const [, a, b] = edges[cur]; es[ek(g, a, b)] = 'active'; ns[a] = 'active'; ns[b] = 'active'; }
      const aux = [];
      if (sorted) aux.push({ label: 'edges', kind: 'list', items: edges.map((e, k) => ({ v: tup(...e), s: est[k] === 'tree' ? 'tree' : est[k] === 'bad' ? 'bad' : k === cur ? 'active' : k < cur ? null : null })) });
      aux.push({ label: 'mst', kind: 'list', items: mst.map((e) => tup(...e)) });
      t.step(line, msg, {
        views: [
          gview(g, { ns, es }),
          { type: 'kv', title: 'parent (union-find)', entries: nodes.filter((x) => x in parent).map((x) => [x, parent[x]]), states: kvS },
        ],
        vars: vars({ w, u, v, ru, rv, total }),
        aux,
      });
    };
    step('call', 'Call `kruskal(graph)`. Goal: connect all nodes with the cheapest set of edges (no cycles).');
    nodes.forEach((x) => (parent[x] = x));
    step('init', 'Union-find: each node starts in its own set (`parent[x] = x`).');
    sorted = true;
    step(['sort', 'sort2'], `Take each edge once (\`u < v\`) as \`(w, u, v)\` and sort: cheapest first. ${edges.length} edges.`);
    total = 0;
    for (cur = 0; cur < edges.length; cur++) {
      [w, u, v] = edges[cur]; ru = rv = undefined; kvS = {};
      step('for', `Next cheapest edge: ${u}–${v} with weight ${w}.`);
      ru = find(u); rv = find(v);
      kvS = { [u]: 'compare', [v]: 'compare' };
      if (ru === rv) {
        est[cur] = 'bad';
        step(['find', 'same'], `find(${q(u)}) = ${q(ru)} and find(${q(v)}) = ${q(rv)}: same set. ${u} and ${v} are already connected, so this edge would make a cycle. Skip.`);
        continue;
      }
      step(['find', 'same'], `find(${q(u)}) = ${q(ru)}, find(${q(v)}) = ${q(rv)}: different sets, so the edge is safe.`);
      parent[ru] = rv; est[cur] = 'tree'; mst.push([u, v, w]); total += w; kvS = { [ru]: 'new' };
      step(['union', 'take'], `Union: \`parent['${ru}'] = '${rv}'\`. Take ${u}–${v}. total = ${total}, ${mst.length} edge${mst.length > 1 ? 's' : ''}.`);

      if (mst.length === nodes.length - 1) {
        step('full', `${mst.length} edges = V - 1: every node is connected. Stop.`);
        break;
      }
    }
    cur = -1; w = u = v = ru = rv = undefined;
    step('done', `Return the ${mst.length} edges, total weight ${total}.`);
    t.frames[t.frames.length - 1].vars.return = { raw: `([${mst.map((e) => tup(...e)).join(', ')}], ${total})` };
    return t.frames;
  }

import heapq

def prim(graph, start):
    seen = {start}                  # nodes in the tree  #@init
    heap = [(w, start, v) for v, w in graph[start]]  #@init2
    heapq.heapify(heap)             # cheapest edge on top  #@init3
    mst, total = [], 0
    while heap and len(mst) < len(graph) - 1:  #@loop
        w, u, v = heapq.heappop(heap)  #@pop
        if v in seen:               # both ends in the tree  #@seen
            continue
        seen.add(v)                 # cheapest way out  #@add
        mst.append((u, v, w))
        total += w
        for nxt, w2 in graph[v]:
            if nxt not in seen:     # edge leaves the tree  #@check
                heapq.heappush(heap, (w2, v, nxt))  #@push
    return mst, total               #@done

${pyGraph(GW.adj)}
prim(graph, 'A')   # 5 edges, total 13  #@call
`;

    const step = (line, msg) => {
      const ns = {}, es = {};
      heap.forEach(([, a, b]) => (es[ek(g, a, b)] = 'frontier'));
      Object.keys(skipped).forEach((k) => (es[k] = 'bad'));
      mst.forEach(([a, b]) => (es[ek(g, a, b)] = 'tree'));

    total = 0; newNode = null;

      if (!go) break;

def has_cycle(graph):
    color = {u: WHITE for u in graph}  #@init

    def dfs(u):
        color[u] = GRAY             # u is on the current path  #@gray
        for v in graph[u]:
            if color[v] == GRAY:    # back edge: cycle  #@back

            if color[v] == WHITE and dfs(v):  #@white
                return True         # pass it up  #@up
        color[u] = BLACK            # fully explored, safe  #@black

    for u in graph:

          { type: 'kv', title: 'color', entries: nodes.filter((x) => x in color).map((x) => [x, NAME[color[x]]]), states: kvS },
        ],
        vars: vars({ u: u || outerU, v, return: ret }),
        aux: [{ label: 'call stack', kind: 'stack', items: stack.map((x, i) => ({ v: `dfs('${x}')`, s: i === stack.length - 1 ? 'active' : null })) }],
      });
    };
    const dfs = (u) => {
      stack.push(u); v = undefined; act = null;
      color[u] = 1;
      step('gray', `Enter \`dfs('${u}')\`: colour ${q(u)} GRAY. GRAY = on the path we are exploring right now.`);
      for (const b of adj[u]) {
        v = b; act = ek(g, u, b); actS = 'active';
        if (color[b] === 1) {
          const from = stack.indexOf(b);
          const path = stack.slice(from);

          actS = 'bad';
          step('back', `${q(b)} is GRAY: it is on the current path, so ${u} → ${b} is a back edge. Cycle: ${path.concat(b).join(' → ')}.`);
          step('found', 'Return True.');
          stack.pop();
          return true;
        }
        if (color[b] === 2) {
          step('white', `${q(b)} is BLACK: already fully explored, no path from it comes back here. Not a cycle, skip.`);
          continue;
        }
        tree[act] = 'tree';
        step('white', `${q(b)} is WHITE (unvisited): explore it with \`dfs('${b}')\`.`);

    for (const u of nodes) {
      outerU = u;

      if (dfs(u)) {
        outerU = u; ret = true;
        step('yes', 'A cycle was found. Return True.');
        return t.frames;
      }
    }
    outerU = undefined; ret = false;
    step('no', 'No back edge anywhere. Return False.');
    return t.frames;
  }

  const CYC_UND = `
def has_cycle(graph):
    parent = {u: u for u in graph}  # union-find, all alone  #@init

    def find(x):                    # root of x's set
        while parent[x] != x:
            parent[x] = parent[parent[x]]  # path halving
            x = parent[x]
        return x

    for u in graph:
        for v in graph[u]:
            if u > v:               # seen as (v, u) already  #@skip
                continue
            ru, rv = find(u), find(v)  #@find
            if ru == rv:            # already connected  #@same
                return True         # this edge closes a loop  #@found
            parent[ru] = rv         # union: merge the sets  #@union
    return False

${pyGraph(GCU.adj)}
has_cycle(graph)   # True: E-F closes A-B-D-E-F-C  #@call
`;

  function traceCycleUnd() {
    const g = GCU, adj = g.adj, nodes = Object.keys(adj);
    const t = DSA.tracer();
    const parent = {}, joined = [];
    let u, v, ru, rv, act = null, actS = 'active', kvS = {}, cyc = null, ret;
    const find = (x) => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };

        views: [
          gview(g, { ns, es, ptr: ptrs([[u, 'u'], [v, 'v']]) }),
          { type: 'kv', title: 'parent (union-find)', entries: nodes.filter((x) => x in parent).map((x) => [x, parent[x]]), states: kvS },
        ],
        vars: vars({ u, v, ru, rv, return: ret }),
      });
    };
    step('call', 'Call `has_cycle(graph)` on an undirected graph. Idea: an edge whose two ends are already connected closes a loop.');
    nodes.forEach((x) => (parent[x] = x));
    step('init', 'Union-find: every node is its own set.');
    for (const a of nodes) {
      for (const b of adj[a]) {
        u = a; v = b; ru = rv = undefined; act = ek(g, a, b); actS = 'active'; kvS = {};
        if (a > b) {
          step('skip', `(${q(a)}, ${q(b)}): already handled as (${q(b)}, ${q(a)}). Skip.`);
          continue;
        }
        ru = find(a); rv = find(b); kvS = { [a]: 'compare', [b]: 'compare' };
        if (ru === rv) {
          // path between a and b along joined edges
          const nb = {};
          joined.forEach(([x, y]) => { (nb[x] = nb[x] || []).push(y); (nb[y] = nb[y] || []).push(x); });
          const prev = { [a]: null }, qq = [a];
          while (qq.length) { const x = qq.shift(); (nb[x] || []).forEach((y) => { if (!(y in prev)) { prev[y] = x; qq.push(y); } }); }
          const path = [];
          for (let x = b; x != null; x = prev[x]) path.push(x);
          cyc = { nodes: path, edges: path.slice(1).map((x, i) => ek(g, x, path[i])) };
          actS = 'bad';
          step(['find', 'same'], `find(${q(a)}) = ${q(ru)}, find(${q(b)}) = ${q(rv)}: same set. ${a} and ${b} are already connected by other edges.`);
          ret = true;
          step('found', `So edge ${a}–${b} closes a loop: ${path.slice().reverse().join('–')}–${a}. Return True.`);
          return t.frames;
        }
        step(['find', 'same'], `find(${q(a)}) = ${q(ru)}, find(${q(b)}) = ${q(rv)}: different sets, no loop yet.`);
        parent[ru] = rv; joined.push([a, b]); kvS = { [ru]: 'new' };
        step('union', `Union: \`parent['${ru}'] = '${rv}'\`. ${a} and ${b} are now in one set.`);
      }
    }
    u = v = ru = rv = undefined; act = null; ret = false;
    step('no', 'Every edge joined two separate sets. Return False.');
    return t.frames;
  }

  DSA.addAlgo({

    category: 'Graphs',

    tips: [

    problems: ['207. Course Schedule', '802. Find Eventual Safe States', '684. Redundant Connection', '261. Graph Valid Tree', '1971. Find if Path Exists in Graph'],
    variants: [

        id: 'directed',

        file: 'cycle_directed',

/* Algorithms · Linked List Patterns */
(function () {

    const v = (arr || []).slice(0, max);
    return v.length ? v : fallback.slice();
  };
  // pointers helper: {id: label} merged into {id: [labels]}
  function ptrs(list) {
    const out = {};
    list.forEach(([id, label]) => {
      if (id === undefined) return;
      const key = id === null ? 'null' : id;
      out[key] = out[key] ? [].concat(out[key], label) : label;
    });
    return out;
  }
  const LISTNODE = `
class ListNode:
    def __init__(self, val=0, next=None):
        self.val, self.next = val, next
`;

  /* ====================================================================
   * Reverse a linked list
   * ==================================================================== */
  const revInput = {
    default: { nums: [1, 2, 3, 4, 5] },
    random: () => ({ nums: U.randArray(U.randInt(4, 6), 1, 9) }),
    fields: [listInput(7)],
  };

  DSA.addAlgo({
    id: 'reverse-linked-list',
    title: 'Reverse a Linked List',
    category: 'Linked List Patterns',
    order: 1,
    tags: ['reverse', 'prev curr next', 'pointer manipulation', 'in place'],
    summary: 'Flip every `next` arrow so the list runs backwards. The last node becomes the new head.',
    complexity: { time: 'O(n)', space: 'O(1)' },
    notes: [
      'Save `curr.next` **before** you overwrite it, or you lose the rest of the list.',
      'The loop ends when `curr` is None; `prev` is then the new head.',
      'Python tuple assignment does it in one line: `curr.next, prev, curr = prev, curr, curr.next`.',
      'Recursion uses O(n) stack; Python\'s default limit is about 1000 frames.',
    ],
    tips: [
      'Draw three boxes (`prev`, `curr`, `nxt`) and move them one step at a time before coding.',
      'Reverse a sub-range (92) or in groups of k (25) with the same three pointers plus a node before the range.',
    ],
    problems: ['206. Reverse Linked List', '92. Reverse Linked List II', '25. Reverse Nodes in k-Group', '234. Palindrome Linked List', '143. Reorder List'],
    input: revInput,
    variants: [
      {
        id: 'iterative',
        label: 'Iterative',
        summary: 'Walk the list once with three pointers: `prev` (already reversed part), `curr` (node being flipped) and `nxt` (the rest, saved before flipping).',
        complexity: { time: 'O(n)', space: 'O(1)' },
        legend: { visited: 'Reversed part', active: 'curr' },
        code: LISTNODE + `
def reverse_list(head):
    prev, curr = None, head         # nothing reversed yet  #@init
    while curr:                     #@loop
        nxt = curr.next             # save the rest  #@save
        curr.next = prev            # flip the arrow  #@flip
        prev = curr                 # prev steps forward  #@prev
        curr = nxt                  # curr steps forward  #@curr
    return prev                     # new head  #@done
`,
        trace(inp) {
          const vals = cleanVals(inp.nums, 7, [1, 2, 3]);
          const n = vals.length;
          const ids = vals.map((_, i) => 'n' + i);
          const next = vals.map((_, i) => (i + 1 < n ? i + 1 : null));
          const t = DSA.tracer();
          const view = (prev, curr, nxt, o) => {
            o = o || {};
            const nodes = vals.map((v, i) => ({ id: ids[i], v, s: i === curr ? 'active' : prev != null && i <= prev ? 'visited' : null }));
            const links = next.map((j, i) => ({ from: ids[i], to: j == null ? null : ids[j], s: o.hot === i ? 'active' : null }));
            const p = ptrs([[prev == null ? null : ids[prev], 'prev'], [curr == null ? undefined : ids[curr], 'curr'], [nxt == null ? undefined : ids[nxt], 'nxt']]);
            return { type: 'linked', nodes, links, pointers: p, nullLeft: true };
          };
          const vv = (prev, curr, nxt) => {
            const o = { prev: node(prev == null ? null : vals[prev]), curr: node(curr == null ? null : vals[curr]) };
            if (nxt !== undefined) o.nxt = node(nxt == null ? null : vals[nxt]);
            return o;
          };
          let prev = null, curr = 0, nxt;
          t.step('init', `\`prev = None\`, \`curr = head\` (${vals[0]}). Nothing is reversed yet.`, { view: view(prev, curr), vars: vv(prev, curr) });
          while (true) {
            t.step('loop', curr != null ? `\`curr\` is ${vals[curr]}, not None: keep going.` : '`curr` is None: every arrow is flipped.', { view: view(prev, curr, nxt), vars: vv(prev, curr, nxt) });
            if (curr == null) break;
            nxt = next[curr];
            t.step('save', `\`nxt = curr.next\` = ${nxt == null ? 'None' : vals[nxt]}. Save it before the link is overwritten.`, { view: view(prev, curr, nxt), vars: vv(prev, curr, nxt) });
            next[curr] = prev;
            t.step('flip', `\`curr.next = prev\`: ${vals[curr]} now points to ${prev == null ? 'None' : vals[prev]}.`, { view: view(prev, curr, nxt, { hot: curr }), vars: vv(prev, curr, nxt) });
            prev = curr;
            t.step('prev', `\`prev = curr\` (${vals[prev]}). The reversed part now starts at ${vals[prev]}.`, { view: view(prev, curr, nxt), vars: vv(prev, curr, nxt) });

            t.step('curr', curr == null ? '`curr = nxt` = None. We just flipped the last node.' : `\`curr = nxt\` (${vals[curr]}). Move on to the next node.`, { view: view(prev, curr, nxt), vars: vv(prev, curr, nxt) });
          }
          const rev = vals.slice().reverse();
          const result = { type: 'linked', title: 'result', nodes: rev.map((v, i) => ({ id: 'r' + i, v, s: 'found' })), pointers: { r0: 'head' } };
          t.step('done', `Return \`prev\` (${vals[prev]}), the new head: ${listRepr(rev)}.`, { views: [view(prev, null, null), result], vars: Object.assign(vv(prev, null, null), { return: node(vals[prev]) }) });
          return t.frames;
        },
      },
      {
        id: 'recursive',
        label: 'Recursive',
        summary: 'Reverse the rest of the list first, then hook the current node onto its end. The work happens **on the way back** up the call stack.',
        complexity: { time: 'O(n)', space: 'O(n)', note: 'One stack frame per node.' },
        legend: { visited: 'Already reversed', active: 'head (this call)' },
        code: LISTNODE + `
def reverse_list(head):
    if not head or not head.next:   # 0 or 1 node  #@base
        return head                 # it is the new head  #@ret
    # reverse everything after head first
    new_head = reverse_list(head.next)  #@rec
    head.next.next = head           # next node points back  #@back
    head.next = None                # head is now the tail  #@cut
    return new_head                 # pass it up unchanged  #@up
`,
        trace(inp) {
          const vals = cleanVals(inp.nums, 7, [1, 2, 3]);
          const n = vals.length;
          const ids = vals.map((_, i) => 'n' + i);
          const next = vals.map((_, i) => (i + 1 < n ? i + 1 : null));
          const t = DSA.tracer();
          const stack = [];
          let newHead = null;
          const aux = () => [{ label: 'call stack', kind: 'stack', items: stack.map((i, k) => ({ v: `reverse_list(${vals[i]})`, s: k === stack.length - 1 ? 'active' : null })) }];
          const view = (h, o) => {
            o = o || {};
            const nodes = vals.map((v, i) => ({ id: ids[i], v, s: i === h ? 'active' : o.revFrom != null && i >= o.revFrom ? 'visited' : null }));
            const links = next.map((j, i) => ({ from: ids[i], to: j == null ? null : ids[j], s: o.hot === i ? 'active' : null }));
            const p = ptrs([[ids[h], 'head'], [newHead == null ? undefined : ids[newHead], 'new_head']]);
            return { type: 'linked', nodes, links, pointers: p };
          };
          const vv = (h, extra) => Object.assign({ head: node(vals[h]), new_head: node(newHead == null ? null : vals[newHead]) }, extra || {});
          const rec = (h) => {
            stack.push(h);
            const last = next[h] == null;

              t.step('ret', `Return ${vals[h]}. The last node is the new head.`, { view: view(h), vars: vv(h, { return: node(vals[h]) }), aux: aux() });
              stack.pop();

            }
            t.step('rec', `Call \`reverse_list(${vals[h + 1]})\` to reverse everything after ${vals[h]}.`, { view: view(h), vars: vv(h), aux: aux() });

            t.step('back', `Back in \`reverse_list(${vals[h]})\` with \`new_head = ${vals[newHead]}\`. \`head.next.next = head\`: ${vals[h + 1]} now points back to ${vals[h]}.`, { view: view(h, { revFrom: h + 1, hot: h + 1 }), vars: vv(h), aux: aux() });

          const last = t.frames[t.frames.length - 1];
          last.views = [last.view, { type: 'linked', title: 'result', nodes: rev.map((v, i) => ({ id: 'r' + i, v, s: 'found' })), pointers: { r0: 'head' } }];

        },
      },
    ],
  });

   * Fast & slow pointers

  DSA.addAlgo({
    id: 'fast-slow-pointers',
    title: 'Fast & Slow Pointers',
    category: 'Linked List Patterns',
    order: 2,
    tags: ['tortoise and hare', 'floyd', 'cycle detection', 'middle of linked list', 'runner'],
    summary: 'Move one pointer one step and another two steps at a time. When `fast` reaches the end, `slow` is in the middle. If there is a cycle, `fast` laps `slow` and they meet.',
    complexity: { time: 'O(n)', space: 'O(1)' },
    notes: [
      'Loop guard `while fast and fast.next` stops safely at both odd and even lengths.',

      'Compare nodes with `is`, not values: two nodes can hold the same value.',

    tips: [

    ],
    problems: ['876. Middle of the Linked List', '141. Linked List Cycle', '142. Linked List Cycle II', '234. Palindrome Linked List', '287. Find the Duplicate Number', '202. Happy Number'],
    variants: [
      {
        id: 'middle',
        label: 'Find middle',
        file: 'middle_node',
        summary: '`fast` moves two steps for every one step of `slow`. When `fast` runs out of list, `slow` has covered half of it.',
        legend: { active: 'slow', frontier: 'fast', found: 'Middle' },
        input: {

          random: () => ({ nums: U.range(U.randInt(5, 7)).map((i) => i + 1) }),
          fields: [listInput(8)],

        code: `
# ListNode has .val and .next
def middle_node(head):
    slow = fast = head              # both start at head  #@init
    while fast and fast.next:       # fast can take 2 steps  #@loop
        slow = slow.next            # 1 step  #@slow
        fast = fast.next.next       # 2 steps  #@fast

        trace(inp) {
          const vals = cleanVals(inp.nums, 8, [1, 2, 3]);

          const ids = vals.map((_, i) => 'n' + i);
          const t = DSA.tracer();
          const view = (s, f, done) => ({
            type: 'linked',
            nodes: vals.map((v, i) => ({ id: ids[i], v, s: i === s ? (done ? 'found' : 'active') : i === f ? 'frontier' : null })),

            t.step('fast', f < n ? `\`fast\` jumps two to ${vals[f]}.` : '`fast` jumps two, past the last node: now None.', { view: view(s, f), vars: vv(s, f) });
          }
          t.step('done', `Return \`slow\` (${vals[s]}), index ${s} of ${n}. ${n % 2 ? 'Odd length: the exact middle.' : 'Even length: the second of the two middle nodes.'}`, { view: view(s, f, true), vars: Object.assign(vv(s, f), { return: node(vals[s]) }) });

      },
      {
        id: 'cycle',
        label: 'Detect cycle',
        file: 'has_cycle',
        summary: 'Floyd\'s cycle detection. Inside a loop, `fast` gains one node on `slow` every step, so it must land on `slow`. With no loop, `fast` simply reaches the end.',
        legend: { active: 'slow', frontier: 'fast', found: 'They meet' },
        input: {
          default: { nums: [1, 2, 3, 4, 5, 6], pos: 2 },
          random: () => {
            const n = U.randInt(5, 7);

          },
          fields: [listInput(8), { key: 'pos', label: 'tail links to index (-1 = none)', type: 'number' }],
        },
        code: `
# ListNode has .val and .next
def has_cycle(head):
    slow = fast = head              # both start at head  #@init
    while fast and fast.next:       # no end reached yet  #@loop
        slow = slow.next            # 1 step  #@slow
        fast = fast.next.next       # 2 steps  #@fast

    return False                    # fast hit the end  #@no

        trace(inp) {

          const view = (s, f, meet) => ({
            type: 'linked',
            nodes: vals.map((v, i) => ({ id: ids[i], v, s: meet && i === s ? 'found' : i === s ? 'active' : i === f ? 'frontier' : null })),
            links,
            pointers: ptrs([[ids[s], 'slow'], [f != null ? ids[f] : undefined, 'fast']]),

      '`dummy = ListNode()` removes the "is the result empty?" check. Return `dummy.next`.',

      'Reach for a dummy head whenever the first node of the output might change (remove, partition, merge).',

    ],
    problems: ['21. Merge Two Sorted Lists', '23. Merge k Sorted Lists', '148. Sort List', '86. Partition List', '2. Add Two Numbers'],
    file: 'merge_two_lists',
    input: {
      default: { a: [1, 4, 6], b: [2, 4, 7] },

    code: LISTNODE + `
def merge_two_lists(a, b):
    dummy = tail = ListNode()           # fake head  #@init
    while a and b:                      # both have nodes  #@loop
        if a.val <= b.val:              # take the smaller  #@cmp
            tail.next, a = a, a.next    # link a, advance a  #@takea
        else:
            tail.next, b = b, b.next    # link b, advance b  #@takeb
        tail = tail.next                # move to the end  #@tail
    tail.next = a or b                  # attach the rest  #@rest
    return dummy.next                   # skip the dummy  #@done
`,
    trace(inp) {
      const A = (inp.a || []).slice(0, 5).sort((x, y) => x - y);
      const B = (inp.b || []).slice(0, 5).sort((x, y) => x - y);
      const t = DSA.tracer();
      let ia = 0, ib = 0;
      const out = []; // [{id, v}] taken, in order
      let linked = 0; // how many of out are linked from their predecessor
      let restAttached = false;
      const src = (vals, pre, idx, name, o) => {
        o = o || {};

        const pointers = idx < vals.length ? { [pre + idx]: name } : { null: name };

      };

      const scale = 0.95;

      const vv = () => ({ a: node(ia < A.length ? A[ia] : null), b: node(ib < B.length ? B[ib] : null), tail: { raw: tailIdx < 0 ? 'dummy' : `ListNode(${out[tailIdx].v})` } });
      t.step('init', '`dummy = tail = ListNode()`: a placeholder (val 0) before the real head, so the first append is like any other.', { views: views(), vars: vv() });
      while (true) {
        const both = ia < A.length && ib < B.length;
        const msg = both ? `\`a\` (${A[ia]}) and \`b\` (${B[ib]}) both have nodes.` : `\`${ia < A.length ? 'b' : 'a'}\` is None. Stop the loop.`;
        t.step('loop', msg, { views: views(), vars: vv() });
        if (!both) break;
        const takeA = A[ia] <= B[ib];
        t.step('cmp', `Is ${A[ia]} <= ${B[ib]}? ${takeA ? `Yes, take ${A[ia]} from \`a\`${A[ia] === B[ib] ? ' (ties go to a)' : ''}.` : `No, take ${B[ib]} from \`b\`.`}`, { views: views({ hotA: true, hotB: true }), vars: vv() });
        if (takeA) { out.push({ id: 'a' + ia, v: A[ia] }); ia++; } else { out.push({ id: 'b' + ib, v: B[ib] }); ib++; }
        linked = out.length;
        const k = out.length - 1;
        const from = tailIdx < 0 ? 'dummy' : out[tailIdx].v;
        t.step(takeA ? 'takea' : 'takeb', `\`tail.next\` = ${out[k].v} (${from} → ${out[k].v}). Advance \`${takeA ? 'a' : 'b'}\` to ${takeA ? (ia < A.length ? A[ia] : 'None') : ib < B.length ? B[ib] : 'None'}.`, { views: views({ newIdx: k }), vars: vv() });
        tailIdx = k;
        t.step('tail', `\`tail\` moves to ${out[k].v}, the last merged node.`, { views: views(), vars: vv() });
      }
      const restVals = ia < A.length ? A.slice(ia).map((v, i) => ({ id: 'a' + (ia + i), v })) : B.slice(ib).map((v, i) => ({ id: 'b' + (ib + i), v }));
      const which = ia < A.length ? 'a' : ib < B.length ? 'b' : null;
      restVals.forEach((x) => out.push(x));
      linked = out.length;
      if (which === 'a') ia = A.length; else if (which === 'b') ib = B.length;
      restAttached = true;
      t.step('rest', which ? `\`tail.next = a or b\`: hang the rest of \`${which}\` (${restVals.map((x) => x.v).join(' → ')}) on the end. It is already sorted and linked.` : '`tail.next = a or b`: both are None, so nothing is left.', { views: views(), vars: vv() });

      t.step('done', merged.length ? `Return \`dummy.next\` (${merged[0]}): ${listRepr(merged)}.` : 'Both lists were empty. Return `dummy.next`, which is None.', { views: views(), vars: Object.assign(vv(), { return: node(merged.length ? merged[0] : null) }) });
      return t.frames;
    },
  });
})();

<script>
/* Algorithms · Math & Bits */
(function () {
  const U = DSA.util;
  let BIT_INPUT;

  const num = (x, lo, hi, d) => {
    let v = Math.trunc(Number(x));
    if (!isFinite(v)) v = d;
    return Math.max(lo, Math.min(hi, v));
  };
  const capNote = (raw, used, what) => (Number(raw) !== used ? `(${what} capped at ${used} so the picture stays readable.) ` : '');

  /* ---------- bit helpers ---------- */
  // bits of x, most significant first, padded to w
  const bitsOf = (x, w) => Array.from({ length: w }, (_, i) => (x >> (w - 1 - i)) & 1);
  const widthFor = (...xs) => {
    const L = Math.max(1, ...xs.map((x) => Math.max(0, x).toString(2).length));
    return Math.max(4, Math.ceil(L / 4) * 4);
  };
  const bin = (x) => ({ raw: `'${x < 0 ? '-0b' + (-x).toString(2) : '0b' + x.toString(2)}'` });
  // one array row showing the bits of x; states indexed by bit position (0 = lowest)
  const bitRow = (label, x, w, byBit) => ({
    label,
    items: bitsOf(x, w),
    states: bitsOf(x, w).map((_, i) => (byBit ? byBit[w - 1 - i] : null) || null),
    showIndex: false,
  });
  const lowBit = (x) => (x & -x);
  const bitIndex = (p) => Math.round(Math.log2(p));

  /* =====================================================================
   * Bit tricks
   * ===================================================================== */
  function countBitsTrace(inp) {
    const n0 = num(inp.n, 0, 65535, 44);
    const note = capNote(inp.n, n0, 'n');
    const w = widthFor(n0);
    const t = DSA.tracer();
    const title = `${w}-bit view, lowest bit on the right`;
    let n = n0, count = 0;
    t.step('init', note + `n = ${n0} = ${bin(n0).raw}. count = 0.`, { view: { type: 'array', title, rows: [bitRow(`n = ${n}`, n, w)] }, vars: { n, 'bin(n)': bin(n), count } });
    while (true) {
      t.step('loop', n ? `n = ${n} is not 0: it still has set bits.` : 'n is 0: every set bit has been cleared.', { view: { type: 'array', title, rows: [bitRow(`n = ${n}`, n, w)] }, vars: { n, 'bin(n)': bin(n), count } });
      if (!n) break;
      const lb = bitIndex(lowBit(n));
      const m1 = n - 1;
      const res = n & m1;
      // n: lowest set bit active; n-1: that bit and everything below flip
      const nStates = { [lb]: 'active' };
      const mStates = {};
      for (let k = 0; k <= lb; k++) mStates[k] = 'swap';
      t.step('clear', `n - 1 = ${m1} flips the lowest set bit (bit ${lb}) and every bit below it. AND-ing keeps only bits set in both, so bit ${lb} is gone: ${n} & ${m1} = ${res}.`, {
        view: { type: 'array', title, rows: [bitRow(`n = ${n}`, n, w, nStates), bitRow(`n - 1 = ${m1}`, m1, w, mStates), bitRow(`n & (n-1) = ${res}`, res, w, { [lb]: 'removed' })] },
        vars: { n: res, 'bin(n)': bin(res), count },
      });
      n = res;
      count++;
      t.step('inc', `One set bit removed, count = ${count}.`, { view: { type: 'array', title, rows: [bitRow(`n = ${n}`, n, w)] }, vars: { n, 'bin(n)': bin(n), count } });
    }
    t.step('done', `Return ${count}. The loop ran once per **set** bit, not once per bit. Same as \`(${n0}).bit_count()\` or \`bin(${n0}).count('1')\`.`, { view: { type: 'array', title, rows: [bitRow(`n = ${n0}`, n0, w, Object.fromEntries(bitsOf(n0, w).map((b, i) => [w - 1 - i, b ? 'found' : null])))] }, vars: { n, count, return: count } });
    return t.frames;
  }

  function singleNumberTrace(inp) {
    let nums = (inp.nums || []).map((x) => num(x, 0, 255, 0)).slice(0, 10);
    if (!nums.length) nums = [0];
    const w = widthFor(...nums);
    const t = DSA.tracer();
    const title = `bits (${w}-bit), lowest on the right`;
    const arr = (i, st) => ({ type: 'array', label: 'nums', items: nums, states: nums.map((_, k) => (k === i ? st || 'active' : i != null && k < i ? 'done' : null)), pointers: i != null ? [{ i, label: 'v' }] : [] });
    let x = 0;
    t.step('init', 'x = 0. XOR with 0 changes nothing, so it is the identity.', { views: [arr(null), { type: 'array', title, rows: [bitRow('x = 0', 0, w)] }], vars: { nums, x } });
    nums.forEach((v, i) => {
      t.step('loop', `v = ${v}.`, { views: [arr(i), { type: 'array', title, rows: [bitRow(`x = ${x}`, x, w), bitRow(`v = ${v}`, v, w)] }], vars: { x, v } });
      const nx = x ^ v;
      const flips = {};
      for (let k = 0; k < w; k++) if ((v >> k) & 1) flips[k] = 'swap';
      t.step('xor', `x ^= ${v}: every 1-bit of v flips the same bit of x. ${x} ^ ${v} = ${nx}.${nums.slice(0, i).includes(v) ? ` ${v} was seen before, so this undoes it.` : ''}`, {
        views: [arr(i), { type: 'array', title, rows: [bitRow(`x = ${x}`, x, w), bitRow(`v = ${v}`, v, w, flips), bitRow(`x ^ v = ${nx}`, nx, w, flips)] }],
        vars: { x: nx, v },
      });
      x = nx;
    });
    const st = nums.map((v) => (v === x ? 'found' : 'dim'));
    t.step('done', `Return ${x}. Every value that appears twice cancelled itself (a ^ a == 0); only the single one is left. O(n) time, O(1) space.`, { views: [{ type: 'array', label: 'nums', items: nums, states: st }, { type: 'array', title, rows: [bitRow(`x = ${x}`, x, w)] }], vars: { x, return: x } });
    return t.frames;
  }

  function powerOfTwoTrace(inp) {
    const n = num(inp.n, -65535, 65535, 44);
    const note = capNote(inp.n, n, 'n');
    const t = DSA.tracer();
    const w = widthFor(Math.abs(n));
    const title = `${w}-bit view, lowest bit on the right`;
    t.step('check', note + (n <= 0 ? `${n} <= 0: zero and negatives are never powers of two.` : `${n} > 0, keep going.`), { view: { type: 'array', title, rows: [bitRow(`n = ${n}`, Math.max(0, n), w)] }, vars: { n } });
    if (n <= 0) {
      t.step(3, 'Return False.', { view: { type: 'array', title, rows: [bitRow(`n = ${n}`, 0, w)] }, vars: { n, return: false } });
      return t.frames;
    }

    const lb = bitIndex(lowBit(n));
    const m1 = n - 1, res = n & m1;
    const flip = {};
    for (let k = 0; k <= lb; k++) flip[k] = 'swap';
    t.step('ret', `n - 1 = ${m1} flips bit ${lb} (the lowest set bit) and every bit below it.`, { view: { type: 'array', title, rows: [bitRow(`n = ${n}`, n, w, { [lb]: 'active' }), bitRow(`n - 1 = ${m1}`, m1, w, flip)] }, vars: { n, 'bin(n)': bin(n), 'n - 1': m1 } });
    const ok = res === 0;
    const rs = {};
    for (let k = 0; k < w; k++) if ((res >> k) & 1) rs[k] = 'bad';
    t.step('ret', ok ? `${n} & ${m1} = 0: n had exactly one set bit, so it is a power of two (2^${lb}). Return True.` : `${n} & ${m1} = ${res} != 0: n has ${ones} set bits, so it is not a power of two. Return False.`, {
      view: { type: 'array', title, rows: [bitRow(`n = ${n}`, n, w), bitRow(`n - 1 = ${m1}`, m1, w), bitRow(`n & (n-1) = ${res}`, res, w, ok ? {} : rs)] },
      vars: { n, 'n & (n - 1)': res, return: ok },
    });
    return t.frames;
  }

    problems: ['191. Number of 1 Bits', '136. Single Number', '231. Power of Two', '338. Counting Bits', '268. Missing Number', '190. Reverse Bits'],
    input: (BIT_INPUT = {

    variants: [
      {
        id: 'count-bits',
        label: 'Count bits',
        file: 'count_bits',
        summary: 'Count the 1-bits (popcount / Hamming weight). `n &= n - 1` wipes out the lowest set bit each loop, so the loop runs once per **set** bit instead of once per bit (Brian Kernighan\'s trick).',
        complexity: { time: 'O(set bits)', space: 'O(1)' },

        legend: { active: 'Lowest set bit', swap: 'Flipped by n - 1', removed: 'Cleared', found: 'Counted' },

    x = 0                                              #@init
    for v in nums:                                     #@loop
        x ^= v                  # a ^ a == 0, a ^ 0 == a  #@xor
    return x                    # the pairs cancelled  #@done

# one-liner: functools.reduce(operator.xor, nums)
`,
        legend: { active: 'Current v', done: 'Seen', swap: 'Flipped bits', found: 'Single number', dim: 'Cancelled out' },

def is_power_of_two(n):
    if n <= 0:                                         #@check
        return False            # 0 and negatives
    # one set bit: n - 1 clears it and sets all below
    return (n & (n - 1)) == 0                          #@ret

# also: n > 0 and n.bit_count() == 1
`,

  /* =====================================================================
   * GCD (Euclid)

  const gcdIn = (inp) => ({ a: num(Math.abs(Number(inp.a)), 0, 999999, 462), b: num(Math.abs(Number(inp.b)), 0, 999999, 1071) });
  const gcdGrid = (rows, active, found) => ({

  DSA.addAlgo({
    id: 'gcd',
    title: 'GCD (Euclid)',
    category: 'Math & Bits',
    order: 2,
    legend: { active: 'Current (a, b)', new: 'a % b', found: 'gcd', done: 'b == 0' },
    tags: ['gcd', 'lcm', 'euclid', 'euclidean algorithm', 'modulo', 'math.gcd'],
    summary: 'Greatest common divisor by Euclid\'s rule: `gcd(a, b) == gcd(b, a % b)`, and `gcd(a, 0) == a`. The numbers shrink at least by half every two steps, so it is O(log min(a, b)).',
    complexity: { time: 'O(log min(a, b))', space: 'O(1)' },
    notes: [
      'Use the built-in: `math.gcd(a, b)` (any number of args since 3.9). `math.lcm` exists since 3.9.',
      '`lcm(a, b) = a // gcd(a, b) * b` (divide first to keep numbers small).',
      'Order does not matter: if `a < b`, the first step just swaps them (`a % b == a`).',
      'gcd of a list: `functools.reduce(math.gcd, nums)`.',
    ],
    tips: [
      'Why it works: any d dividing a and b also divides `a - k*b`, i.e. `a % b`, and vice versa.',

    ],
    problems: ['1979. Find Greatest Common Divisor of Array', '1071. Greatest Common Divisor of Strings', '914. X of a Kind in a Deck of Cards', '365. Water and Jug Problem', '149. Max Points on a Line'],
    input: {
      default: { a: 462, b: 1071 },
      random: () => {
        const g = U.randInt(2, 15);
        return { a: g * U.randInt(2, 40), b: g * U.randInt(2, 40) };
      },

        { key: 'a', label: 'a', type: 'number' },

    variants: [
      {
        id: 'iterative',
        label: 'Iterative',
        summary: 'Replace `(a, b)` with `(b, a % b)` until `b` is 0. Then `a` is the gcd. The tuple assignment updates both at once.',
        complexity: { time: 'O(log min(a, b))', space: 'O(1)' },
        code: `
def gcd(a, b):
    while b:                    # stop when b == 0  #@loop
        a, b = b, a % b         # gcd(a, b) == gcd(b, a % b)  #@step
    return a                    # same as math.gcd(a, b)  #@done
`,
        trace(inp) {
          let { a, b } = gcdIn(inp);
          const t = DSA.tracer();
          const rows = [[a, b, '']];
          t.step('loop', b ? `b = ${b} is not 0, keep going.` : 'b is 0 already.', { view: gcdGrid(rows, 0), vars: { a, b } });
          while (b) {
            const r = a % b;
            rows[rows.length - 1][2] = r;
            const na = b, nb = r;
            t.step('step', `${a} % ${b} = ${r}. New pair: (a, b) = (${na}, ${nb}).${a < b ? ' a < b, so this step just swapped them.' : ''}`, { view: gcdGrid(rows, rows.length - 1), vars: { a: na, b: nb } });
            a = na; b = nb;
            rows.push([a, b, '']);
            t.step('loop', b ? `b = ${b} is not 0, keep going.` : 'b is 0: stop.', { view: gcdGrid(rows, rows.length - 1), vars: { a, b } });

          t.step('done', `Return ${a}. gcd(${gcdIn(inp).a}, ${gcdIn(inp).b}) = ${a} after ${rows.length - 1} step${rows.length === 2 ? '' : 's'}.`, { view: gcdGrid(rows, null, rows.length - 1), vars: { a, b, return: a } });
          return t.frames;
        },
      },
      {
        id: 'recursive',
        label: 'Recursive',
        summary: 'The same rule as a one-line recursion. The base case `b == 0` returns `a`; every other call hands `(b, a % b)` down. Depth is O(log min(a, b)), so recursion is safe here.',
        complexity: { time: 'O(log min(a, b))', space: 'O(log min(a, b))', note: 'Space is the recursion depth.' },
        code: `
def gcd(a, b):
    if b == 0:                  # base case  #@base
        return a                                       #@ret
    return gcd(b, a % b)        # same answer, smaller pair  #@rec
`,
        trace(inp) {
          let { a, b } = gcdIn(inp);
          const t = DSA.tracer();
          const rows = [[a, b, '']];
          const stack = [`gcd(${a}, ${b})`];

            a = b; b = r;
            rows.push([a, b, '']);

          t.step('ret', `Return ${a}. Each waiting call returns it unchanged, so gcd(${gcdIn(inp).a}, ${gcdIn(inp).b}) = ${a}.`, { view: gcdGrid(rows, null, rows.length - 1), vars: { a, b, return: a }, aux: aux() });

  /* =====================================================================

  DSA.addAlgo({
    id: 'sieve',
    title: 'Sieve of Eratosthenes',
    category: 'Math & Bits',
    order: 3,
    tags: ['primes', 'sieve', 'prime numbers', 'isqrt', 'count primes'],
    summary: 'Find every prime up to `n`. Assume all are prime, then for each prime `p` cross out its multiples. Start at `p * p` (smaller multiples were crossed by smaller primes) and stop once `p * p > n`.',
    complexity: { time: 'O(n log log n)', space: 'O(n)' },
    notes: [
      'Outer loop only to `isqrt(n)`: a composite ≤ n always has a factor ≤ √n.',
      'Inner loop starts at `p * p`; `2p, 3p, …` below that already fell to 2, 3, ….',
      'Slice assignment is the fast Python idiom: `is_prime[p*p::p] = [False] * len(range(p*p, n + 1, p))`.',
      'Single number check: trial division up to `isqrt(n)`, O(√n).',
    ],
    tips: [
      'Use a sieve when you need many primes or many checks; trial division for one check.',
      'Smallest-prime-factor sieve (store `spf[m] = p`) lets you factor any number ≤ n in O(log n).',
    ],
    problems: ['204. Count Primes', '762. Prime Number of Set Bits', '2523. Closest Prime Numbers in Range', '952. Largest Component Size by Common Factor'],
    input: {
      default: { n: 30 },
      random: () => ({ n: U.randInt(15, 40) }),
      fields: [{ key: 'n', label: 'n', type: 'number' }],
    },
    legend: { pivot: 'Prime p', active: 'Current', removed: 'Not prime', found: 'Prime', bad: 'Skip (not prime)' },
    code: `
from math import isqrt

def primes_up_to(n):                   # n >= 2
    is_prime = [True] * (n + 1)                        #@init
    is_prime[0] = is_prime[1] = False                  #@zero
    for p in range(2, isqrt(n) + 1):   # p * p <= n  #@loop
        if is_prime[p]:                                #@check
            # smaller multiples were crossed already
            for m in range(p * p, n + 1, p):           #@inner
                is_prime[m] = False                    #@cross
    return [i for i, ok in enumerate(is_prime) if ok]  #@done
`,
    trace(inp) {
      const n = num(inp.n, 2, 40, 30);
      const note = capNote(inp.n, n, 'n');
      const t = DSA.tracer();
      const isPrime = new Array(n + 1).fill(true);
      const COLS = 10;
      const rowsN = Math.floor(n / COLS) + 1;
      const confirmed = new Set();
      const g = (extra) => {
        const cells = [], states = {};
        for (let r = 0; r < rowsN; r++) {
          const row = [];
          for (let c = 0; c < COLS; c++) {
            const v = r * COLS + c;
            row.push(v <= n ? v : null);
            if (v <= n) {
              if (!isPrime[v]) states[r + ',' + c] = 'removed';
              else if (confirmed.has(v)) states[r + ',' + c] = 'found';
            }
          }
          cells.push(row);
        }
        Object.entries(extra || {}).forEach(([v, s]) => { states[Math.floor(v / COLS) + ',' + (v % COLS)] = s; });
        return { type: 'grid', title: `numbers 0 to ${n}`, cells, states };
      };
      const lim = Math.floor(Math.sqrt(n));
      const primesVar = () => ({ raw: String(isPrime.filter(Boolean).length) + ' still True' });
      t.step('init', note + `Assume every number 0..${n} is prime.`, { view: g(), vars: { n, is_prime: primesVar() } });
      isPrime[0] = isPrime[1] = false;
      t.step('zero', '0 and 1 are not prime by definition.', { view: g(), vars: { n, is_prime: primesVar() } });
      for (let p = 2; p <= lim; p++) {
        t.step('loop', `p = ${p} (only up to isqrt(${n}) = ${lim}, since ${lim + 1}² = ${(lim + 1) * (lim + 1)} > ${n}).`, { view: g({ [p]: 'active' }), vars: { n, p } });
        if (!isPrime[p]) {
          t.step('check', `${p} was already crossed out (it is a multiple of a smaller prime). Its multiples are crossed too. Skip.`, { view: g({ [p]: 'bad' }), vars: { n, p } });
          continue;
        }
        confirmed.add(p);
        t.step('check', `${p} is still True, so it is prime. Cross out its multiples from ${p}² = ${p * p}.`, { view: g({ [p]: 'pivot' }), vars: { n, p } });
        for (let m = p * p; m <= n; m += p) {
          const was = isPrime[m];
          isPrime[m] = false;
          t.step(['inner', 'cross'], `m = ${m} = ${p} × ${m / p}: not prime.${was ? '' : ' (Already crossed by a smaller prime.)'}`, { view: g({ [p]: 'pivot', [m]: 'active' }), vars: { n, p, m } });
        }
      }
      for (let v = 2; v <= n; v++) if (isPrime[v]) confirmed.add(v);
      const primes = isPrime.map((ok, i) => (ok ? i : null)).filter((x) => x != null);
      t.step('done', `Everything still True is prime: ${primes.length} prime${primes.length === 1 ? '' : 's'} up to ${n}.`, { view: g(), vars: { n, return: primes } });
      return t.frames;
    },
  });

  DSA.addAlgo({
    id: 'fast-power',
    title: 'Fast Exponentiation',
    category: 'Math & Bits',
    order: 4,
    tags: ['binary exponentiation', 'exponentiation by squaring', 'pow', 'modpow', 'power'],
    summary: 'Compute `a ** b` in O(log b) multiplications. Walk the bits of `b` from the lowest: square `a` each step (a, a², a⁴, a⁸, …) and multiply it into the result whenever the current bit is 1.',
    complexity: { time: 'O(log b)', space: 'O(1)' },
    notes: [
      'Built-in: `pow(a, b, m)` does modular fast power in C. `pow(a, -1, m)` gives the modular inverse (3.8+).',
      'For a modulus, reduce after every multiply: `result = result * a % m`, `a = a * a % m`.',
      '13 = 0b1101, so a¹³ = a⁸ · a⁴ · a¹: one factor per 1-bit.',
      'Same idea works for matrices (Fibonacci in O(log n)) or any associative operation.',
    ],
    tips: [
      'LeetCode 50 (Pow(x, n)): handle negative n with `x = 1 / x; n = -n`.',
      'In Python `a ** b` is already fast for ints; interviewers want to see the squaring loop.',
    ],
    problems: ['50. Pow(x, n)', '372. Super Pow', '1922. Count Good Numbers', '509. Fibonacci Number'],
    input: {
      default: { a: 3, b: 13 },
      random: () => ({ a: U.randInt(2, 5), b: U.randInt(5, 30) }),
      fields: [
        { key: 'a', label: 'a', type: 'number' },
        { key: 'b', label: 'b', type: 'number' },
      ],
    },
    legend: { active: 'Current bit', compare: 'Current bit is 0', found: 'Bit 1: multiplied in', dim: 'Bit 0: skipped' },
    code: `
def fast_pow(a, b):                # b >= 0
    result = 1                                         #@init
    while b > 0:                                       #@loop
        if b & 1:                  # lowest bit is 1  #@bit
            result *= a            # use this power of a  #@mul
        a *= a                     # a, a^2, a^4, a^8, ...  #@sq
        b >>= 1                    # move to the next bit  #@shift
    return result                  # pow(a, b, m) for mod  #@done
`,
    trace(inp) {
      const a0 = num(inp.a, -10, 10, 3), b0 = num(inp.b, 0, 40, 13);
      const note = Number(inp.a) !== a0 || Number(inp.b) !== b0 ? `(capped to a = ${a0}, b = ${b0} so the numbers stay readable.) ` : '';
      const t = DSA.tracer();
      const W = Math.max(1, b0.toString(2).length);
      const bits = b0.toString(2).padStart(W, '0').split('').map(Number); // MSB first
      const base = a0 < 0 ? `(${a0})` : String(a0);
      const powers = bits.map((_, i) => `${base}^${2 ** (W - 1 - i)}`);
      // k = index of the bit being looked at (0 = lowest)
      const v = (k, cur) => {
        const st = bits.map((bt, i) => {
          const pos = W - 1 - i;
          if (pos === k) return cur || 'active';
          if (pos < k) return bt ? 'found' : 'dim';
          return null;
        });
        return { type: 'array', title: `exponent ${b0} in binary · read right to left`, rows: [
          { label: 'bits of b', items: bits, states: st, pointers: k >= 0 && k < W ? [{ i: W - 1 - k, label: 'b & 1' }] : [], showIndex: false },
          { label: 'a at that bit', items: powers, states: st, showIndex: false },
        ] };
      };
      let a = BigInt(a0), b = b0, result = 1n, k = 0;
      const vars = (extra) => Object.assign({ a: { raw: String(a) }, b, 'bin(b)': { raw: `'0b${b.toString(2)}'` }, result: { raw: String(result) } }, extra || {});
      t.step('init', note + `result = 1. We will read the bits of b = ${b0} from the lowest one up.`, { view: v(0), vars: vars() });
      while (true) {
        t.step('loop', b > 0 ? `b = ${b} > 0: bits remain.` : 'b = 0: all bits used.', { view: v(k), vars: vars() });
        if (!(b > 0)) break;
        const bit = b & 1;
        t.step('bit', bit ? `Lowest bit of b is 1: this power of a is part of the answer.` : `Lowest bit of b is 0: skip this power.`, { view: v(k, bit ? 'found' : 'compare'), vars: vars() });
        if (bit) {
          const before = result;
          result *= a;
          t.step('mul', `result = ${before} × ${powers[W - 1 - k]} (= ${a}) = ${result}.`, { view: v(k, 'found'), vars: vars() });
        }
        const pa = a;
        a *= a;
        t.step('sq', `Square a: ${pa}² = ${a}, which is ${base}^${2 ** (k + 1)}, ready for the next bit.`, { view: v(k, bit ? 'found' : 'dim'), vars: vars() });
        b >>= 1;
        k++;
        t.step('shift', `Shift b right: b = ${b} (0b${b.toString(2)}). The bit we used is gone.`, { view: v(k), vars: vars() });
      }
      t.step('done', `Return ${result} = ${base}^${b0}, using ${k} squarings instead of ${Math.max(0, b0 - 1)} multiplications.`, { view: v(W), vars: vars({ return: { raw: String(result) } }) });
      return t.frames;
    },
  });
})();
