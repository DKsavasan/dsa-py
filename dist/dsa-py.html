/* dsa.py — styles
   Palette: cool neutral ground, ink black, "essence orange" accent,
   VS Code Dark Modern for the editor. Liquid-glass controls use an SVG
   displacement filter over a backdrop blur (see #lg-displace in index.html). */

:root {
  color-scheme: light;
  --sans: "Geist", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --bg: #eceef1;
  --bg-2: #f6f7f9;
  --ink: #0d0e10;
  --ink-2: #33363c;
  --muted: #6b7079;
  --line: rgba(13, 14, 16, 0.09);
  --line-2: rgba(13, 14, 16, 0.16);
  --panel: rgba(255, 255, 255, 0.66);
  --panel-solid: #ffffff;
  --chip-bg: rgba(13, 14, 16, 0.05);
  --accent: #ff5b14;
  --accent-soft: rgba(255, 91, 20, 0.12);
  --focus: #2f6bff;

  --glass-bg: rgba(255, 255, 255, 0.22);
  --glass-tint: rgba(255, 255, 255, 0.34);
  --glass-rim: rgba(255, 255, 255, 1);
  --glass-rim-2: rgba(255, 255, 255, 0.35);
  --glass-shadow: 0 10px 28px -10px rgba(18, 22, 30, 0.22), 0 1px 2px rgba(18, 22, 30, 0.08);
  --glass-ind: rgba(255, 255, 255, 0.78);
  --glass-hi: rgba(255, 255, 255, 0.7);

  /* visualisation */
  --v-fill: #ffffff;
  --v-stroke: #d3d7dd;
  --v-text: #15171b;
  --v-edge: #b9bec7;
  --v-head: #f1f3f5;

  /* state colours: fill / stroke / text */
  --c-active: #ff5b14;
  --c-compare-f: #ffc53d; --c-compare-s: #eea000; --c-compare-t: #2a1c00;
  --c-swap: #f43f5e;
  --c-visited-f: #cff3ec; --c-visited-s: #14b8a6; --c-visited-t: #0b4d45;
  --c-frontier-f: #dde8ff; --c-frontier-s: #3b82f6; --c-frontier-t: #1e3a8a;
  --c-done-f: #15171b; --c-done-t: #ffffff;
  --c-found: #22c55e;
  --c-path: #16a34a;
  --c-pivot: #8b5cf6;
  --c-min: #0ea5e9;
  --c-bad-f: #ffe1e4; --c-bad-s: #ef4444; --c-bad-t: #9f1239;
  --c-new-f: #d9f99d; --c-new-s: #84cc16; --c-new-t: #1a2e05;
  --c-read-f: #fff3cd; --c-read-s: #f59e0b; --c-read-t: #5c3d00;
  --c-range-f: rgba(59, 130, 246, 0.09); --c-range-s: rgba(59, 130, 246, 0.5);

  /* Big-O badges */
  --o-good-b: #dcfce7; --o-good-t: #166534;
  --o-ok-b: #d5f5ef; --o-ok-t: #115e59;
  --o-lin-b: #fdf0c8; --o-lin-t: #8a4b06;
  --o-mid-b: #ffe6d3; --o-mid-t: #9a3412;
  --o-bad-b: #ffe2e6; --o-bad-t: #9f1239;

  --blob-1: rgba(255, 110, 40, 0.30);
  --blob-2: rgba(120, 220, 120, 0.26);
  --blob-3: rgba(80, 140, 255, 0.24);

  --radius: 22px;
  --topbar-h: 68px;
  --side-w: 268px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b0c0e; --bg-2: #131418; --ink: #eceef1; --ink-2: #c3c7ce; --muted: #8b9099;
    --line: rgba(255, 255, 255, 0.08); --line-2: rgba(255, 255, 255, 0.16);

    --glass-bg: rgba(255, 255, 255, 0.05); --glass-tint: rgba(255, 255, 255, 0.06);
    --glass-rim: rgba(255, 255, 255, 0.55); --glass-rim-2: rgba(255, 255, 255, 0.1);
    --glass-shadow: 0 12px 30px -12px rgba(0, 0, 0, 0.7), 0 1px 2px rgba(0, 0, 0, 0.5);
    --glass-ind: rgba(255, 255, 255, 0.16); --glass-hi: rgba(255, 255, 255, 0.28);
    --v-fill: #1b1d22; --v-stroke: #363a42; --v-text: #eceef1; --v-edge: #4a4f59; --v-head: #23262c;
    --c-compare-f: #ffc53d; --c-compare-s: #ffc53d; --c-compare-t: #221700;
    --c-visited-f: #0f3a35; --c-visited-s: #2dd4bf; --c-visited-t: #a7f3e7;
    --c-frontier-f: #16244a; --c-frontier-s: #60a5fa; --c-frontier-t: #cfe0ff;
    --c-done-f: #eceef1; --c-done-t: #0b0c0e;
    --c-bad-f: #43141b; --c-bad-s: #f87171; --c-bad-t: #fecdd3;
    --c-new-f: #2b3d0c; --c-new-s: #a3e635; --c-new-t: #e4fbb7;
    --c-read-f: #3d2c05; --c-read-s: #fbbf24; --c-read-t: #fde9b0;
    --c-range-f: rgba(96, 165, 250, 0.1); --c-range-s: rgba(96, 165, 250, 0.55);
    --o-good-b: rgba(34, 197, 94, 0.16); --o-good-t: #86efac;
    --o-ok-b: rgba(45, 212, 191, 0.15); --o-ok-t: #7eeadb;
    --o-lin-b: rgba(245, 180, 40, 0.16); --o-lin-t: #fcd57a;
    --o-mid-b: rgba(255, 120, 50, 0.17); --o-mid-t: #ffb38a;
    --o-bad-b: rgba(244, 63, 94, 0.17); --o-bad-t: #fda4b4;
    --blob-1: rgba(255, 100, 30, 0.16); --blob-2: rgba(90, 200, 90, 0.10); --blob-3: rgba(70, 120, 255, 0.16);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0c0e; --bg-2: #131418; --ink: #eceef1; --ink-2: #c3c7ce; --muted: #8b9099;
  --line: rgba(255, 255, 255, 0.08); --line-2: rgba(255, 255, 255, 0.16);
  --panel: rgba(22, 24, 28, 0.66); --panel-solid: #16181c; --chip-bg: rgba(255, 255, 255, 0.07);
  --accent: #ff6a26; --accent-soft: rgba(255, 106, 38, 0.16); --focus: #7aa2ff;
  --glass-bg: rgba(255, 255, 255, 0.05); --glass-tint: rgba(255, 255, 255, 0.06);
  --glass-rim: rgba(255, 255, 255, 0.55); --glass-rim-2: rgba(255, 255, 255, 0.1);
  --glass-shadow: 0 12px 30px -12px rgba(0, 0, 0, 0.7), 0 1px 2px rgba(0, 0, 0, 0.5);
  --glass-ind: rgba(255, 255, 255, 0.16); --glass-hi: rgba(255, 255, 255, 0.28);
  --v-fill: #1b1d22; --v-stroke: #363a42; --v-text: #eceef1; --v-edge: #4a4f59; --v-head: #23262c;
  --c-compare-f: #ffc53d; --c-compare-s: #ffc53d; --c-compare-t: #221700;
  --c-visited-f: #0f3a35; --c-visited-s: #2dd4bf; --c-visited-t: #a7f3e7;
  --c-frontier-f: #16244a; --c-frontier-s: #60a5fa; --c-frontier-t: #cfe0ff;
  --c-done-f: #eceef1; --c-done-t: #0b0c0e;
  --c-bad-f: #43141b; --c-bad-s: #f87171; --c-bad-t: #fecdd3;
  --c-new-f: #2b3d0c; --c-new-s: #a3e635; --c-new-t: #e4fbb7;
  --c-read-f: #3d2c05; --c-read-s: #fbbf24; --c-read-t: #fde9b0;
  --c-range-f: rgba(96, 165, 250, 0.1); --c-range-s: rgba(96, 165, 250, 0.55);
  --o-good-b: rgba(34, 197, 94, 0.16); --o-good-t: #86efac;
  --o-ok-b: rgba(45, 212, 191, 0.15); --o-ok-t: #7eeadb;
  --o-lin-b: rgba(245, 180, 40, 0.16); --o-lin-t: #fcd57a;
  --o-mid-b: rgba(255, 120, 50, 0.17); --o-mid-t: #ffb38a;
  --o-bad-b: rgba(244, 63, 94, 0.17); --o-bad-t: #fda4b4;
  --blob-1: rgba(255, 100, 30, 0.16); --blob-2: rgba(90, 200, 90, 0.10); --blob-3: rgba(70, 120, 255, 0.16);
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
code { font-family: var(--mono); font-size: 0.88em; background: var(--chip-bg); padding: 0.1em 0.4em; border-radius: 6px; }
kbd { font: 500 11.5px/1 var(--mono); padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--panel-solid); color: var(--ink-2); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.fx-defs { position: absolute; width: 0; height: 0; }
.muted { color: var(--muted); }

.ambient { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.ambient .blob { position: absolute; border-radius: 50%; filter: blur(70px); }
.ambient .b1 { width: 46vw; height: 46vw; left: -10vw; top: -14vw; background: var(--blob-1); animation: drift 26s ease-in-out infinite alternate; }
.ambient .b2 { width: 40vw; height: 40vw; right: -12vw; top: 18vh; background: var(--blob-2); animation: drift 32s ease-in-out infinite alternate-reverse; }
.ambient .b3 { width: 50vw; height: 50vw; left: 30vw; bottom: -30vw; background: var(--blob-3); animation: drift 30s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate(6vw, 4vh) scale(1.08); } }

/* ---------- liquid glass ---------- */
.lg, .lg-seg {
  position: relative;
  border-radius: 999px;
  -webkit-tap-highlight-color: transparent;
}
.lg {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 16px;
  border: 0; background: transparent; color: var(--ink);
  font: 500 14px/1 var(--sans);
  cursor: pointer;
  box-shadow: var(--glass-shadow);
  transition: transform 0.5s cubic-bezier(0.3, 1.7, 0.45, 1), box-shadow 0.3s;
}
.lg > :not(.lg-fx), .lg-seg > :not(.lg-fx):not(.lg-ind) { position: relative; z-index: 2; }
.lg:hover { transform: translateY(-1px) scale(1.035); }
.lg:active { transform: scale(0.94); transition-duration: 0.12s; }
.lg-fx { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; z-index: 0; }
.lg-blur {
  position: absolute; inset: -20px; border-radius: inherit;
  background: var(--glass-bg);
  -webkit-backdrop-filter: blur(5px) saturate(150%);
  backdrop-filter: blur(5px) saturate(150%);
  filter: url(#lg-displace);
  transform: scale(0.94);
}
.lg-tint {
  position: absolute; inset: 0; border-radius: inherit;
  background: var(--glass-tint);
  box-shadow: inset 0 1px 2px var(--glass-hi), inset 0 -1px 2px rgba(255, 255, 255, 0.06);
}
.lg-shine {
  position: absolute; inset: 0; border-radius: inherit; opacity: 0;
  background: radial-gradient(140px circle at var(--mx, 30%) var(--my, 0%), var(--glass-hi), transparent 62%);
  transition: opacity 0.35s;
}
.lg:hover .lg-shine, .lg-seg:hover > .lg-fx .lg-shine { opacity: 1; }
.lg-fx::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
  background: linear-gradient(110deg, var(--glass-rim-2) 0%, rgba(255, 255, 255, 0) 38%, var(--glass-rim) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  pointer-events: none;
}

/* segmented control with a sliding liquid blob */
.lg-seg { display: inline-flex; align-items: center; padding: 4px; gap: 2px; box-shadow: var(--glass-shadow); }
.lg-seg > a, .lg-seg > button {
  border: 0; background: none; cursor: pointer;
  height: 34px; padding: 0 15px; border-radius: 999px;
  display: inline-flex; align-items: center; white-space: nowrap;
  font: 500 14px/1 var(--sans); color: var(--muted);
  transition: color 0.3s;
}
.lg-seg > a:hover, .lg-seg > button:hover { color: var(--ink); }
.lg-seg > .on { color: var(--ink); }
.lg-ind {
  position: absolute; left: 0; top: 0; z-index: 1; height: 34px; width: 0;
  border-radius: 999px; opacity: 0; pointer-events: none;
  box-shadow: 0 6px 16px -6px rgba(18, 22, 30, 0.35), 0 1px 1px rgba(18, 22, 30, 0.08);
  transform-origin: center;
}
.lg-ind .lg-tint { background: var(--glass-ind); }
.lg-ind .lg-blur { filter: url(#lg-displace); }

/* ---------- top bar ---------- */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 40;
  padding-top: env(safe-area-inset-top, 0px);
  pointer-events: none;
}
.topbar::before {
  content: ""; position: absolute; inset: 0 0 -24px 0; z-index: -1;
  background: linear-gradient(var(--bg) 30%, transparent);
  opacity: 0.92;
}
.topbar-inner {
  height: var(--topbar-h); display: flex; align-items: center; gap: 14px;
  padding-inline: 20px; pointer-events: auto;
}
.brand { display: inline-flex; align-items: baseline; font-weight: 700; font-size: 25px; letter-spacing: -0.045em; margin-right: 6px; }
.brand-mark { font-style: italic; transform: skewX(-6deg); display: inline-block; }
.brand-ext { font-family: var(--mono); font-weight: 500; font-size: 17px; color: var(--accent); letter-spacing: -0.02em; margin-left: 1px; }
.nav-tabs { margin-left: auto; margin-right: auto; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.icon-btn { width: 40px; padding: 0; }
.search-btn { color: var(--muted); padding-right: 8px; }
.search-btn kbd { margin-left: 4px; }
.search-btn .search-label { color: var(--ink-2); }
.i-moon { display: none; }
:root[data-theme="dark"] .i-sun { display: none; }
:root[data-theme="dark"] .i-moon { display: block; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .i-sun { display: none; }
  :root:not([data-theme="light"]) .i-moon { display: block; }
}

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; transition: grid-template-columns 0.45s cubic-bezier(0.3, 1, 0.4, 1); }
@media (min-width: 961px) {
  body.side-closed .shell, body[data-tab="home"] .shell { grid-template-columns: 0px minmax(0, 1fr); }
  .sidebar { width: var(--side-w); transition: opacity 0.3s, transform 0.45s cubic-bezier(0.3, 1, 0.4, 1); }
  body.side-closed .sidebar, body[data-tab="home"] .sidebar { opacity: 0; transform: translateX(-30px); pointer-events: none; visibility: hidden; transition: opacity 0.25s, transform 0.45s, visibility 0s 0.45s; }
  body.side-closed .main, body[data-tab="home"] .main { padding-left: 28px; }
  body.side-closed .main > *, body[data-tab="home"] .main > * { margin-inline: auto; }
}
.sidebar {
  position: sticky; top: 0; height: 100vh; z-index: 30;
  padding: calc(var(--topbar-h) + env(safe-area-inset-top, 0px) + 8px) 14px 14px 18px;
  display: flex; flex-direction: column; gap: 12px;
}
.side-head { display: flex; flex-direction: column; gap: 10px; }
.side-title { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 0 12px; font: 600 14px/1 var(--sans); letter-spacing: -0.01em; }
.side-title em { font: 500 11px/1 var(--mono); font-style: normal; color: var(--muted); margin-left: 4px; }
.side-close { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--muted); display: grid; place-items: center; cursor: pointer; transition: color 0.2s, transform 0.4s cubic-bezier(0.3, 1.7, 0.5, 1); }
.side-close:hover { color: var(--ink); transform: translateX(-2px); }
.side-btn .side-fill { transition: opacity 0.3s; opacity: 0.9; }
body.side-closed .side-btn .side-fill { opacity: 0; }
body[data-tab="home"] .side-btn { display: none; }

/* dropdown menus under the top nav */
.nav-tabs > a { gap: 6px; }
.nav-tabs .chev { opacity: 0.55; transition: transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1), opacity 0.2s; }
.nav-tabs a.menu-open .chev { transform: rotate(180deg); opacity: 1; }
.mega { position: absolute; left: 0; right: 0; top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px) - 6px); display: flex; justify-content: center; padding-inline: 16px; pointer-events: none; z-index: 45; }
.mega-card {
  pointer-events: auto; width: min(1200px, 100%); max-height: min(76vh, 680px); overflow: auto;
  padding: 16px 22px 8px; border-radius: 24px;
  background: color-mix(in srgb, var(--panel-solid) 88%, transparent);
  -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%);
  border: 1px solid var(--line); box-shadow: 0 30px 70px -24px rgba(10, 14, 22, 0.35), inset 0 1px 1px var(--glass-hi);
  transform-origin: top center;
}
.mega-card.in { animation: megaIn 0.42s cubic-bezier(0.3, 1.35, 0.45, 1); }
@keyframes megaIn { from { opacity: 0; transform: translateY(-8px) scale(0.975); } }
.mega-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 8px 12px; border-bottom: 1px solid var(--line); margin-bottom: 12px; font: 600 12px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.mega-head a { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 13px; color: var(--ink-2); }
.mega-head a:hover { color: var(--accent); }
.mega-cols { columns: 5 168px; column-gap: 14px; }
.mega-col { break-inside: avoid; margin-bottom: 14px; display: flex; flex-direction: column; }
.mega-col h4 { margin: 0 0 4px; padding: 4px 8px; font: 600 11px/1.2 var(--sans); text-transform: uppercase; letter-spacing: 0.09em; color: var(--accent); }
.mega-col a { padding: 5px 8px; border-radius: 9px; font-size: 14px; color: var(--ink-2); transition: background 0.2s, color 0.2s; }
.mega-col a:hover, .mega-col a:focus-visible { background: var(--chip-bg); color: var(--ink); }
.mega-col a.on { color: var(--ink); font-weight: 600; }
.filter {
  display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--muted);
}
.filter input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; font: 400 14px var(--sans); color: var(--ink); }
.filter:focus-within { border-color: var(--line-2); }
.side-list { overflow-y: auto; flex: 1; padding: 2px 4px 40px 0; margin-right: -6px; scrollbar-width: thin; }
.side-group { margin-bottom: 14px; }
.side-cat { font: 600 11px/1 var(--sans); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); padding: 8px 12px 6px; }
.side-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 12px; border-radius: 12px; font-size: 14px; color: var(--ink-2);
  transition: background 0.25s, color 0.25s, transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1);
}
.side-item:hover { background: var(--chip-bg); color: var(--ink); transform: translateX(2px); }
.side-item.on { background: var(--panel-solid); color: var(--ink); font-weight: 600; box-shadow: 0 6px 18px -8px rgba(18, 22, 30, 0.3), inset 0 0 0 1px var(--line); }
.side-item i { font: 500 10.5px/1 var(--mono); font-style: normal; color: var(--muted); border: 1px solid var(--line-2); border-radius: 999px; padding: 3px 6px; }
.side-empty { color: var(--muted); padding: 12px; }
.scrim { display: none; }

.main { padding: calc(var(--topbar-h) + env(safe-area-inset-top, 0px) + 12px) 28px 60px 14px; min-width: 0; outline: none; }
.main > * { max-width: 1480px; }

/* ---------- panels ---------- */
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  backdrop-filter: blur(18px) saturate(140%);
}
.eyebrow { font: 600 11.5px/1.2 var(--sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; display: flex; gap: 8px; align-items: center; }
.eyebrow a:hover { color: var(--accent); }

/* ---------- home ---------- */
.home { display: flex; flex-direction: column; gap: 28px; padding-top: 18px; }
.hero { padding: 18px 6px 8px; }
.hero-title { font-size: clamp(38px, 6vw, 76px); line-height: 0.98; letter-spacing: -0.05em; font-weight: 600; margin: 0 0 20px; text-wrap: balance; }
.hero-title span { color: var(--muted); }
.hero-sub { font-size: 18px; color: var(--ink-2); max-width: 62ch; margin: 0 0 26px; }
.hero-cta { display: flex; gap: 12px; flex-wrap: wrap; }
.btn-lg { height: 54px; padding: 0 10px 0 24px; font-size: 16px; gap: 14px; }
.btn-lg .cnt { font: 500 13px/1 var(--mono); background: var(--ink); color: var(--bg); border-radius: 999px; padding: 9px 12px; }
.home-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; }
.home-card { padding: 22px 24px; }
.home-card h2 { font-size: 17px; margin: 0 0 14px; letter-spacing: -0.01em; }
.cheat { width: 100%; border-collapse: collapse; font-size: 14px; }
.cheat th { text-align: left; font: 600 11px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 0 8px 10px 0; }
.cheat td { padding: 8px 8px 8px 0; border-top: 1px solid var(--line); vertical-align: middle; }
.cheat td:first-child { color: var(--muted); white-space: nowrap; }
.cheat td:last-child { text-align: right; }
.cheat code { background: none; padding: 0; }
.howto { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 10px; }
.howto li { display: flex; align-items: center; gap: 6px; }
.howto li span { margin-left: 8px; color: var(--ink-2); }

/* ---------- index pages ---------- */
.index-head { padding: 16px 4px 10px; }
.index-head h1, .topic-head h1 { font-size: clamp(30px, 3.6vw, 44px); letter-spacing: -0.04em; line-height: 1.02; margin: 0; font-weight: 600; text-wrap: balance; }
.index-group { margin-top: 26px; }
.index-group h2 { font: 600 12px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 0 0 12px 4px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card {
  display: flex; flex-direction: column; gap: 8px; padding: 16px 18px;
  border-radius: 18px; background: var(--panel); border: 1px solid var(--line);
  transition: transform 0.45s cubic-bezier(0.3, 1.6, 0.5, 1), box-shadow 0.3s, border-color 0.3s;
}
.card:hover { transform: translateY(-3px); box-shadow: var(--glass-shadow); border-color: var(--line-2); }
.card-t { font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
.card-s { color: var(--muted); font-size: 13.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-f { display: flex; gap: 8px; align-items: center; margin-top: auto; }
.vcount { font-size: 12px; color: var(--muted); }

/* ---------- topic ---------- */
.topic { display: flex; flex-direction: column; gap: 18px; container: topic / inline-size; }
.topic-head { padding: 8px 4px 0; display: flex; flex-direction: column; gap: 11px; }
.topic-head .eyebrow { margin: 0; }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.variant-seg { max-width: 100%; flex-wrap: wrap; }
.summary { font-size: 16.5px; line-height: 1.55; color: var(--ink-2); margin: 0; max-width: 88ch; }
.summary code { color: var(--ink); }
.swap { animation: swapIn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes swapIn { from { opacity: 0; transform: translateY(4px); filter: blur(3px); } }
.cx { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cx-item { display: inline-flex; align-items: center; gap: 8px; padding: 5px 5px 5px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.cx-lab { font: 600 11px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 0 2px 0 6px; }
.cx-lab:first-child { margin-left: 0; }
.cx-note { font-size: 13px; color: var(--muted); flex-basis: 100%; }
.obadge { font: 500 12.5px/1 var(--mono); padding: 6px 9px; border-radius: 999px; white-space: nowrap; background: var(--chip-bg); color: var(--ink-2); }
.o-good { background: var(--o-good-b); color: var(--o-good-t); }
.o-ok { background: var(--o-ok-b); color: var(--o-ok-t); }
.o-lin { background: var(--o-lin-b); color: var(--o-lin-t); }
.o-mid { background: var(--o-mid-b); color: var(--o-mid-t); }
.o-bad { background: var(--o-bad-b); color: var(--o-bad-t); }
.ops-wrap { border-radius: 18px; background: var(--panel); border: 1px solid var(--line); padding: 4px 14px 12px; }
.ops-wrap summary { cursor: pointer; font: 600 12px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 10px 0 8px; }
.ops { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 2px 18px; }
.op { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); min-width: 0; flex-wrap: wrap; }
.op code { background: none; padding: 0; color: var(--ink); flex: 1; min-width: 0; overflow-wrap: anywhere; }
.op-note { flex-basis: 100%; font-size: 12.5px; color: var(--muted); margin-top: -2px; }

.stage { display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr); gap: 18px; align-items: start; }
.topic[data-kind="ds"] .stage { grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.18fr); }
.viz-pane { padding: 16px 18px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.pane-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pane-title { font: 600 12px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; }
.lg-item { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.dot { width: 11px; height: 11px; border-radius: 4px; background: var(--sf, var(--v-fill)); box-shadow: inset 0 0 0 1.5px var(--ss, var(--v-stroke)); display: inline-block; }

.inputs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 6px 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-solid); flex: 1 1 180px; min-width: 0; }
.field span { font: 500 12px/1 var(--mono); color: var(--muted); }
.field input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: 500 13.5px var(--mono); color: var(--ink); }
.field:focus-within { border-color: var(--focus); }
.btn-sm { height: 38px; padding: 0 16px; font-size: 13.5px; }
.in-err { color: var(--c-bad-s); font-size: 13px; flex-basis: 100%; }
.in-err:empty { display: none; }

.viz-area { min-height: 260px; display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: 14px; padding: 8px 0; }
.viz-fig { margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.viz-fig figcaption { font: 500 12.5px/1.2 var(--sans); color: var(--muted); text-align: center; }
.viz-scroll { overflow-x: auto; overflow-y: hidden; padding: 4px 2px; scrollbar-width: thin; }
.viz-svg { display: block; width: 100%; height: auto; margin: 0 auto; overflow: visible; font-family: var(--mono); }

.aux { display: flex; flex-direction: column; gap: 8px; }
.aux:empty { display: none; }
.aux-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.aux-label { font: 500 12px/1 var(--mono); color: var(--muted); min-width: 64px; text-align: right; }
.aux-items { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; min-width: 0; }
.aux-end { font: 500 10.5px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 0 4px; }
.aux-empty { font-size: 12.5px; color: var(--muted); font-style: italic; }
.chip { font: 500 13px/1 var(--mono); padding: 7px 10px; border-radius: 9px; background: var(--sf, var(--panel-solid)); color: var(--st, var(--ink)); box-shadow: inset 0 0 0 1px var(--ss, var(--line-2)); animation: chipIn 0.3s ease-out; }
@keyframes chipIn { from { opacity: 0; transform: scale(0.85); } }

.caption { display: flex; gap: 12px; align-items: flex-start; min-height: 52px; padding: 12px 14px; border-radius: 16px; background: var(--panel-solid); border: 1px solid var(--line); font-size: 15px; line-height: 1.5; margin: 0; }
.caption.static { display: block; color: var(--ink-2); font-size: 14px; min-height: 0; }
.cap-step { font: 500 12px/1 var(--mono); color: var(--muted); padding: 5px 8px; border-radius: 999px; background: var(--chip-bg); flex-shrink: 0; margin-top: 1px; }
.cap-msg { color: var(--ink); }

.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.play-btn { width: 104px; background: var(--ink); color: var(--bg); }
.play-btn .lg-tint { background: transparent; }
.play-btn .lg-blur { display: none; }
.play-btn .i-pause { display: none; }
.play-btn.playing .i-pause { display: block; }
.play-btn.playing .i-play { display: none; }
.scrub { flex: 1 1 140px; min-width: 100px; -webkit-appearance: none; appearance: none; height: 6px; border-radius: 999px; background: linear-gradient(90deg, var(--accent) var(--p, 0%), var(--line-2) var(--p, 0%)); outline-offset: 6px; cursor: pointer; }
.scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--panel-solid); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25), inset 0 0 0 1px var(--line-2); transition: transform 0.3s cubic-bezier(0.3, 1.8, 0.5, 1); }
.scrub::-webkit-slider-thumb:hover { transform: scale(1.2); }
.scrub::-moz-range-thumb { width: 20px; height: 20px; border: 0; border-radius: 50%; background: var(--panel-solid); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25); }
.speed-btn { width: 58px; padding: 0; font: 500 13px/1 var(--mono); height: 40px; }

/* ---------- VS Code panel ---------- */
.code-pane {
  --vs-bg: #1f1f1f; --vs-bar: #181818; --vs-border: #2b2b2b; --vs-fg: #cccccc; --vs-num: #6e7681;
  display: flex; flex-direction: column; min-width: 0; container-type: inline-size;
  border-radius: var(--radius); overflow: hidden;
  background: var(--vs-bg); color: var(--vs-fg);
  box-shadow: 0 24px 50px -24px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.2);
  position: sticky; top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px) + 8px);
}
.vs-tabs { display: flex; align-items: stretch; justify-content: space-between; background: var(--vs-bar); border-bottom: 1px solid var(--vs-border); height: 38px; }
.vs-tab { display: flex; align-items: center; gap: 7px; padding: 0 16px; font: 400 13px/1 var(--sans); color: #fff; background: var(--vs-bg); border-top: 2px solid #0078d4; border-right: 1px solid var(--vs-border); margin-bottom: -1px; }
.vs-copy { background: none; border: 1px solid #3c3c3c; color: #cccccc; font: 500 12px/1 var(--sans); border-radius: 6px; padding: 0 10px; margin: 6px 8px; cursor: pointer; transition: background 0.2s; }
.vs-copy:hover { background: #2a2d2e; }
.vs-crumbs { font: 400 12.5px/1 var(--sans); color: #a9a9a9; padding: 8px 16px 6px; }
.vs-crumbs span { color: #6e7681; margin: 0 4px; }
.vs-editor { overflow: auto; max-height: min(68vh, 660px); padding: 4px 0 14px; font: 400 12.8px/1.6 var(--mono); font-size: clamp(10.5px, calc((100cqi - 68px) / 38.6), 13px); scrollbar-color: #424242 transparent; scrollbar-width: thin; position: relative; }
.vs-lines { min-width: max-content; }
.ln { display: flex; position: relative; padding-right: 18px; cursor: text; }
.ln:hover { background: rgba(255, 255, 255, 0.03); }
.ln.sel { background: #2a2d2e; }
.gut { width: 48px; flex-shrink: 0; text-align: right; padding-right: 16px; color: var(--vs-num); user-select: none; position: relative; }
.src { white-space: pre; tab-size: 4; }
.ln.cur { background: rgba(255, 214, 0, 0.13); }
.ln.cur .gut { color: #cccccc; }
.ln.cur-first .gut::before {
  content: ""; position: absolute; left: 8px; top: 4px; width: 13px; height: 13px;
  background: #ffcc00; clip-path: polygon(0 22%, 52% 22%, 52% 0, 100% 50%, 52% 100%, 52% 78%, 0 78%);
  animation: arrowIn 0.25s ease-out;
}
@keyframes arrowIn { from { transform: translateX(-4px); opacity: 0; } }
.t-kw { color: #569cd6; } .t-kw2 { color: #c586c0; } .t-fn { color: #dcdcaa; } .t-cls { color: #4ec9b0; }
.t-str { color: #ce9178; } .t-num { color: #b5cea8; } .t-com { color: #6a9955; } .t-var, .t-prop { color: #9cdcfe; }
.t-self { color: #569cd6; font-style: italic; } .t-op { color: #d4d4d4; } .t-const { color: #4fc1ff; }
.t-br0 { color: #ffd700; } .t-br1 { color: #da70d6; } .t-br2 { color: #179fff; }
.vs-panel { border-top: 1px solid var(--vs-border); background: var(--vs-bar); }
.vs-panel-h { display: flex; justify-content: space-between; padding: 8px 16px; font: 600 11px/1 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: #bbbbbb; }
.vs-dim { color: #6e7681; font-weight: 500; text-transform: none; letter-spacing: 0; }
.vs-vars { padding: 2px 16px 12px; font: 400 13px/20px var(--mono); max-height: 150px; overflow: auto; display: grid; grid-template-columns: 1fr; }
.var { display: flex; gap: 8px; padding: 1px 6px; border-radius: 4px; min-width: 0; }
.var .vk { color: #9cdcfe; flex-shrink: 0; }
.var .vo { color: #858585; }
.var .vv { color: #ce9178; overflow-wrap: anywhere; }
.var.changed { animation: varFlash 1s ease-out; }
.var.changed .vv { color: #ffd479; }
@keyframes varFlash { from { background: rgba(255, 204, 0, 0.22); } to { background: transparent; } }
.vs-empty { color: #6e7681; font-style: italic; }
.vs-status { display: flex; gap: 18px; align-items: center; height: 24px; padding: 0 12px; font: 400 12px/1 var(--sans); color: #fff; background: #0078d4; }
.vs-status span:first-child { margin-right: auto; }
.code-pane.debugging .vs-status { background: #cc6633; }

/* ---------- notes + pager ---------- */
.notes-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; }
.notes-row:empty { display: none; }
.note-card { padding: 18px 20px; }
.note-card h3 { font: 600 12px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 0 0 12px; }
.note-card ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; color: var(--ink-2); font-size: 14.5px; }
.note-card li::marker { color: var(--accent); }
.probs { display: flex; flex-wrap: wrap; gap: 6px; }
.prob { font-size: 13px; padding: 6px 11px; border-radius: 999px; background: var(--chip-bg); color: var(--ink-2); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; }
.pager-btn { height: auto; padding: 12px 22px; flex-direction: column; align-items: flex-start; gap: 5px; border-radius: 22px; max-width: 48%; }
.pager-btn.next { align-items: flex-end; text-align: right; }
.pg-dir { font: 500 11.5px/1 var(--sans); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.pg-t { font-size: 15px; font-weight: 600; }

/* ---------- palette ---------- */
.palette { position: fixed; inset: 0; z-index: 80; background: rgba(10, 12, 16, 0.28); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 16px; }
.palette-card { width: min(620px, 100%); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.45); overflow: hidden; animation: palIn 0.35s cubic-bezier(0.3, 1.4, 0.5, 1); }
@keyframes palIn { from { transform: translateY(-8px) scale(0.98); opacity: 0; } }
#paletteInput { width: 100%; border: 0; outline: 0; font: 400 17px var(--sans); padding: 18px 20px; background: none; color: var(--ink); border-bottom: 1px solid var(--line); }
.palette-list { max-height: 50vh; overflow: auto; padding: 6px; }
.pal-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; }
.pal-item em { font-style: normal; font-size: 12.5px; color: var(--muted); text-align: right; }
.pal-item.on, .pal-item:hover { background: var(--chip-bg); }
.pal-empty { padding: 14px; color: var(--muted); margin: 0; }
.palette-foot { display: flex; gap: 16px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.palette-foot kbd { margin-right: 3px; }

/* ---------- SVG visualisation ---------- */
.viz-svg text { font-size: 14px; font-weight: 500; fill: var(--v-text); }
.viz-svg .cell > rect, .viz-svg .node > circle, .viz-svg .node > rect {
  fill: var(--sf, var(--v-fill)); stroke: var(--ss, var(--v-stroke)); stroke-width: 1.5;
  transition: fill 0.35s, stroke 0.35s;
}
.viz-svg .cell > text, .viz-svg .node > text { fill: var(--st, var(--v-text)); transition: fill 0.35s; }
.viz-svg g.cell, .viz-svg g.node, .viz-svg g.ptr, .viz-svg g.wlabel, .viz-svg g.ghost { transition: transform 0.5s cubic-bezier(0.3, 1.25, 0.5, 1), opacity 0.35s; }
.viz-svg .cell.empty > rect { fill: none; stroke-dasharray: 4 4; }
.viz-svg .kv > rect.khead { fill: var(--v-head); stroke: none; }
.viz-svg .kv > text.ktext { fill: var(--muted); font-size: 12.5px; }
.viz-svg .bar > text.bar-val { fill: var(--ink-2); }
.viz-svg .cell > text.sub { fill: var(--muted); font-size: 11px; }
.viz-svg .lcell > line.div { stroke: var(--ss, var(--v-stroke)); stroke-width: 1.5; }
.viz-svg .lcell > circle.dot { fill: var(--st, var(--v-text)); }
.viz-svg .idx { fill: var(--muted); font-size: 11px; font-weight: 400; }
.viz-svg .idx[class*=" s-"] { fill: var(--ss, var(--accent)); font-weight: 700; }
.viz-svg .row-label { fill: var(--muted); font: 500 12.5px var(--mono); }
.viz-svg .range-label { fill: var(--ss, var(--muted)); font-size: 11.5px; }
.viz-svg .null-t { fill: var(--muted); font-style: italic; font-size: 13px; }
.viz-svg .muted-t { fill: var(--muted); }
.viz-svg rect.range { fill: var(--sf); stroke: var(--ss); stroke-width: 1.5; stroke-dasharray: 5 4; transition: transform 0.5s cubic-bezier(0.3, 1.2, 0.5, 1), width 0.5s cubic-bezier(0.3, 1.2, 0.5, 1), fill 0.3s; }
.viz-svg .edge .eline { stroke: var(--se, var(--v-edge)); stroke-width: 2.2; fill: none; transition: stroke 0.35s, stroke-width 0.35s; }
.viz-svg .edge .ehead { fill: var(--se, var(--v-edge)); transition: fill 0.35s; }
.viz-svg .edge[class*=" s-"] .eline { stroke-width: 3.6; }
.viz-svg .edge.s-dim, .viz-svg .edge.s-dim .eline { stroke-width: 2; opacity: 0.35; }
.viz-svg .link.prev .eline { stroke-dasharray: 4 3; }
.viz-svg .wlabel rect { fill: var(--bg-2); stroke: var(--se, var(--v-stroke)); stroke-width: 1.2; }
.viz-svg .wlabel text { font-size: 12px; fill: var(--ink-2); }
.viz-svg .badge rect { fill: var(--ink); }
.viz-svg .badge text { fill: var(--bg); font-size: 11px; font-weight: 600; }
.viz-svg .ptr path { fill: var(--pc, var(--accent)); }
.viz-svg .ptr text, .viz-svg .ptr-t { fill: var(--pc, var(--accent)); font-weight: 700; font-size: 12.5px; }
.viz-svg .ptr.s-frontier, .viz-svg .ptr.s-min { --pc: var(--c-frontier-s); }
.viz-svg .ptr.s-visited { --pc: var(--c-visited-s); }
.viz-svg .ptr.s-compare { --pc: var(--c-compare-s); }
.viz-svg .ptr.s-pivot { --pc: var(--c-pivot); }
.viz-svg .ptr.s-found, .viz-svg .ptr.s-path { --pc: var(--c-path); }
.viz-svg .ptr.s-bad { --pc: var(--c-bad-s); }
.viz-svg .ptr.s-dim { --pc: var(--muted); }
.viz-svg .ghost rect { fill: none; stroke: var(--v-stroke); stroke-dasharray: 4 4; }
.viz-svg .ghost text { fill: var(--muted); font-size: 12.5px; font-style: italic; }
.viz-svg .tray { fill: none; stroke: var(--v-stroke); stroke-width: 2; stroke-linecap: round; }
.viz-svg .dim, .viz-svg .s-dim { opacity: 0.32; }
.viz-svg .enter { animation: vIn 0.4s ease-out; }
@keyframes vIn { from { opacity: 0; } }
.viz-svg .node.s-start > circle, .viz-svg .node.s-start > rect { stroke: var(--accent); stroke-width: 3.5; }
.viz-svg .node.s-target > circle, .viz-svg .node.s-target > rect { stroke: var(--c-path); stroke-width: 3; stroke-dasharray: 5 3; }

/* state tokens (shared by SVG, chips and legend dots) */
.s-active, .s-current { --sf: var(--c-active); --ss: var(--c-active); --st: #fff; --se: var(--c-active); }

<script>
/* dsa.py — registry + helpers shared by every content file.
 * Content files call DSA.addDS({...}) or DSA.addAlgo({...}).
 * See CONTRIBUTING.md for the full entry schema.
 */
(function (root) {
  'use strict';
  const DSA = root.DSA || (root.DSA = {});
  DSA.ds = [];
  DSA.algo = [];

  // Sidebar order of categories. Unknown categories are appended at the end.
  DSA.categoryOrder = {
    ds: ['Python Built-ins', 'Linear', 'Linked Lists', 'Trees', 'Graphs', 'Advanced'],
    algo: ['Searching', 'Sorting', 'Techniques', 'Linked List Patterns', 'Trees', 'Graphs', 'Backtracking', 'Dynamic Programming', 'Math & Bits'],
  };

  function add(kind, e) {
    if (!e || !e.id) throw new Error('entry needs an id');
    e.kind = kind;
    e.order = e.order == null ? 100 : e.order;
    DSA[kind].push(e);
    return e;
  }
  DSA.addDS = (e) => add('ds', e);
  DSA.addAlgo = (e) => add('algo', e);

  // structuredClone keeps Infinity / -Infinity (JSON would turn them into null)
  const clone = (x) => (x === undefined ? undefined : typeof structuredClone === 'function' ? structuredClone(x) : JSON.parse(JSON.stringify(x)));

  /* ---------- tracer: collects animation frames ----------
   * const t = DSA.tracer();
   * t.step('anchor', 'What happens', { view, vars, aux });
   * return t.frames;
   */
  DSA.tracer = function (limit) {
    const frames = [];
    const max = limit || 700;
    return {
      frames,
      step(line, msg, o) {
        if (frames.length >= max) return;
        o = o || {};
        const f = { line, msg: msg || '' };
        if (o.view) f.view = clone(o.view);
        if (o.views) f.views = clone(o.views);
        if (o.vars) f.vars = clone(o.vars);
        if (o.aux) f.aux = clone(o.aux);
        if (o.out !== undefined) f.out = clone(o.out);
        frames.push(f);
      },
    };
  };

  /* ---------- general utils ---------- */
  const U = (DSA.util = {});
  U.clone = clone;
  U.range = (n) => Array.from({ length: n }, (_, i) => i);
  U.randInt = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
  U.randArray = (n, lo = 1, hi = 50, unique = true) => {
    const out = [];
    const seen = new Set();
    let guard = 0;
    while (out.length < n && guard++ < 1000) {
      const v = U.randInt(lo, hi);
      if (unique && seen.has(v)) continue;
      seen.add(v);
      out.push(v);
    }
    return out;
  };
  U.shuffle = (a) => {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  // Give array items stable ids so the renderer can animate them moving.
  U.withIds = (arr) => arr.map((v, i) => ({ v, id: 'k' + i }));
  // Python-ish repr for the variables panel.
  U.py = function py(x) {
    if (x === null || x === undefined) return 'None';
    if (x === true) return 'True';
    if (x === false) return 'False';
    if (x === Infinity) return "inf";
    if (x === -Infinity) return "-inf";
    if (typeof x === 'string') return "'" + x + "'";
    if (Array.isArray(x)) return '[' + x.map(py).join(', ') + ']';
    if (typeof x === 'object') {
      if ('v' in x && 'id' in x && Object.keys(x).length <= 3) return py(x.v);
      return '{' + Object.keys(x).map((k) => py(k) + ': ' + py(x[k])).join(', ') + '}';
    }
    return String(x);
  };

  /* Binary tree from a level-order list (LeetCode style, null = missing).
   * Node ids: String(value) when all values are unique, else 'n<index>'. */
  U.treeFromLevel = function (arr) {
    if (!arr.length || arr[0] == null) return null;
    const vals = arr.filter((v) => v != null);
    const unique = new Set(vals).size === vals.length;
    const mk = (v, i) => ({ id: unique ? String(v) : 'n' + i, v, left: null, right: null });
    const rootNode = mk(arr[0], 0);
    const q = [rootNode];
    let i = 1;
    while (q.length && i < arr.length) {
      const node = q.shift();
      if (i < arr.length && arr[i] != null) { node.left = mk(arr[i], i); q.push(node.left); }
      i++;
      if (i < arr.length && arr[i] != null) { node.right = mk(arr[i], i); q.push(node.right); }
      i++;
    }
    return rootNode;
  };
  // Insert values into a BST (ids = String(value)).
  U.bstFrom = function (values) {
    let r = null;
    const ins = (node, v) => {
      if (!node) return { id: String(v), v, left: null, right: null };
      if (v < node.v) node.left = ins(node.left, v);
      else if (v > node.v) node.right = ins(node.right, v);
      return node;
    };
    values.forEach((v) => (r = ins(r, v)));
    return r;
  };

  /* Ready-made graphs (node x/y are 0..100). Copy with U.clone before editing. */
  U.graphs = {
    // undirected, 7 nodes
    basic: {
      nodes: [
        { id: 'A', x: 12, y: 50 }, { id: 'B', x: 34, y: 18 }, { id: 'C', x: 34, y: 82 },
        { id: 'D', x: 58, y: 18 }, { id: 'E', x: 58, y: 82 }, { id: 'F', x: 82, y: 34 }, { id: 'G', x: 88, y: 78 },
      ],
      edges: [
        { from: 'A', to: 'B' }, { from: 'A', to: 'C' }, { from: 'B', to: 'D' }, { from: 'C', to: 'E' },
        { from: 'B', to: 'E' }, { from: 'D', to: 'F' }, { from: 'E', to: 'G' }, { from: 'F', to: 'G' },
      ],
    },
    // undirected, weighted
    weighted: {
      nodes: [
        { id: 'A', x: 10, y: 50 }, { id: 'B', x: 32, y: 16 }, { id: 'C', x: 32, y: 84 },
        { id: 'D', x: 60, y: 16 }, { id: 'E', x: 60, y: 84 }, { id: 'F', x: 88, y: 50 },
      ],
      edges: [
        { from: 'A', to: 'B', w: 4 }, { from: 'A', to: 'C', w: 2 }, { from: 'B', to: 'C', w: 1 },
        { from: 'B', to: 'D', w: 5 }, { from: 'C', to: 'E', w: 8 }, { from: 'C', to: 'D', w: 9 },
        { from: 'D', to: 'E', w: 2 }, { from: 'D', to: 'F', w: 6 }, { from: 'E', to: 'F', w: 3 },
      ],
    },
    // directed acyclic (course schedule style)
    dag: {
      directed: true,
      nodes: [
        { id: 'A', x: 10, y: 25 }, { id: 'B', x: 10, y: 75 }, { id: 'C', x: 38, y: 25 },
        { id: 'D', x: 38, y: 75 }, { id: 'E', x: 66, y: 50 }, { id: 'F', x: 90, y: 50 },
      ],
      edges: [
        { from: 'A', to: 'C' }, { from: 'B', to: 'C' }, { from: 'B', to: 'D' },
        { from: 'C', to: 'E' }, { from: 'D', to: 'E' }, { from: 'E', to: 'F' },
      ],
    },
  };
  // Adjacency list (sorted neighbours) from a graph object.
  U.adj = function (g, directed) {
    const d = directed == null ? !!g.directed : directed;
    const a = {};
    g.nodes.forEach((n) => (a[n.id] = []));
    g.edges.forEach((e) => {
      a[e.from].push(e.w == null ? e.to : [e.to, e.w]);
      if (!d) a[e.to].push(e.w == null ? e.from : [e.from, e.w]);
    });
    Object.keys(a).forEach((k) => a[k].sort((x, y) => String(x).localeCompare(String(y))));
    return a;
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* dsa.py — tiny Python highlighter with VS Code "Dark Modern" token classes.
 * DSA.parseCode(code)  -> { lines: [plain text], anchors: {name: lineNo} }
 * DSA.highlightPython(text) -> [html per line]
 * Lines may end with an anchor marker `#@name` that the animation refers to;
 * markers are stripped before display.
 */
(function (root) {
  'use strict';
  const DSA = root.DSA;

  const KW_CTRL = new Set('if elif else for while return break continue pass try except finally raise with yield import from as match case'.split(' '));
  const KW_DECL = new Set('def class lambda None True False and or not is in global nonlocal del assert async await'.split(' '));
  const TYPES = new Set('int float str bool list dict set tuple frozenset bytes object type range deque defaultdict Counter OrderedDict heapq collections bisect math functools itertools Optional List Dict Tuple Set'.split(' '));
  const BUILTINS = new Set('len print sorted min max sum abs enumerate zip map filter reversed iter next isinstance ord chr hash id divmod pow round super any all open input callable getattr setattr hasattr format repr vars'.split(' '));

  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  const RE = {
    comment: /#[^\n]*/y,
    string: /(?:[rRbBuUfF]{1,2})?(?:"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')/y,
    number: /(?:0[xXbBoO][\da-fA-F_]+|\d[\d_]*(?:\.\d*)?(?:[eE][+-]?\d+)?j?|\.\d+)/y,
    ident: /[A-Za-z_][A-Za-z0-9_]*/y,
    deco: /@[A-Za-z_][\w.]*/y,
    ws: /[ \t]+/y,
    op: /(?:\*\*=?|\/\/=?|<<=?|>>=?|->|:=|[-+*/%&|^~<>!=]=?|[()[\]{}:,.;])/y,
  };

  function tokenize(src) {
    const toks = [];
    let i = 0;
    let prevSig = null; // previous significant token
    let prevPrev = null;
    while (i < src.length) {
      const c = src[i];
      if (c === '\n') { toks.push({ t: 'nl', s: '\n' }); i++; continue; }
      let m = null;
      let type = null;
      for (const k of ['ws', 'comment', 'string', 'deco', 'ident', 'number', 'op']) {
        RE[k].lastIndex = i;
        const r = RE[k].exec(src);
        if (r && r.index === i && r[0].length) { m = r[0]; type = k; break; }
      }
      if (!m) { m = c; type = 'op'; }
      // an identifier directly followed by a quote could be a string prefix: handled by string regex order
      if (type === 'ident') {
        // lookahead for '('
        let j = i + m.length;
        while (src[j] === ' ') j++;
        const call = src[j] === '(';
        let cls = 'var';
        if (prevSig && prevSig.s === 'def') cls = 'fn';
        else if (prevSig && prevSig.s === 'class') cls = 'cls';
        else if (KW_CTRL.has(m)) cls = 'kw2';
        else if (KW_DECL.has(m)) cls = 'kw';
        else if (m === 'self' || m === 'cls') cls = 'self';
        else if (prevSig && prevSig.s === '.') cls = call ? 'fn' : 'prop';
        else if (TYPES.has(m)) cls = 'cls';
        else if (BUILTINS.has(m)) cls = call ? 'fn' : 'var';
        else if (call) cls = /^[A-Z]/.test(m) ? 'cls' : 'fn';
        else if (/^[A-Z][A-Z0-9_]+$/.test(m)) cls = 'const';
        else if (/^[A-Z]/.test(m)) cls = 'cls';
        toks.push({ t: cls, s: m });
      } else if (type === 'ws') {
        toks.push({ t: 'ws', s: m });
      } else if (type === 'op') {
        toks.push({ t: /[()[\]{}]/.test(m) ? 'br' : 'op', s: m });
      } else {
        toks.push({ t: type === 'deco' ? 'fn' : type === 'number' ? 'num' : type === 'string' ? 'str' : 'com', s: m });
      }
      if (type !== 'ws') { prevPrev = prevSig; prevSig = { s: m, t: type }; }
      i += m.length;
    }
    return toks;
  }

  // Colour bracket pairs like VS Code's bracket-pair colourisation.
  function highlightPython(src) {
    const toks = tokenize(src);
    const lines = [''];
    let depth = 0;
    for (const tk of toks) {
      if (tk.t === 'nl') { lines.push(''); continue; }

# --- create ---
class BIT:
    def __init__(self, nums):
        self.n = len(nums)
        self.t = [0] * (self.n + 1)   # 1-indexed, t[0] unused
        for i, x in enumerate(nums):

    # --- point update: nums[i] += delta ---
    def add(self, i, delta):          # i is 1-based

            i += i & -i               # next cell covering i

    def prefix(self, i):
        s = 0
        while i > 0:
            s += self.t[i]
            i -= i & -i               # drop the lowest set bit
        return s

    # --- range sum: nums[l..r], inclusive ---
    def range_sum(self, l, r):
        return self.prefix(r) - self.prefix(l - 1)

bit.range_sum(3, 7)             # 7+1+4+6+2 = 20

from collections import OrderedDict
from functools import lru_cache

# --- create ---
class LRUCache:
    def __init__(self, capacity):
        self.cap = capacity
        self.data = OrderedDict()  # oldest first, newest last

    # --- get: read + mark as most recent ---
    def get(self, key):
        if key not in self.data:
            return -1
        self.data.move_to_end(key)    # now newest, O(1)
        return self.data[key]

    # --- put: insert/update, evict if over capacity ---
    def put(self, key, value):
        self.data[key] = value
        self.data.move_to_end(key)    # newest at the end
        if len(self.data) > self.cap:
            self.data.popitem(last=False)  # drop the oldest

# --- use ---
c = LRUCache(2)
c.put(1, "a")
c.put(2, "b")
c.get(1)                        # 'a'; 1 is now newest
c.put(3, "c")                   # full: evicts 2
c.get(2)                        # -1

# --- memoize a function: built in ---

# --- create ---
class Node:
    def __init__(self, key=0, val=0):
        self.key, self.val = key, val   # key needed to evict
        self.prev = self.next = None

class LRUCache:
    def __init__(self, capacity):
        self.cap = capacity
        self.map = {}                   # key -> Node
        # sentinels: head.next = newest, tail.prev = oldest
        self.head, self.tail = Node(), Node()
        self.head.next = self.tail
        self.tail.prev = self.head

    # --- list helpers, both O(1) ---
    def _remove(self, node):
        node.prev.next = node.next      # neighbours skip node
        node.next.prev = node.prev

    def _add_front(self, node):
        node.prev, node.next = self.head, self.head.next
        self.head.next.prev = node      # old first points back
        self.head.next = node

    # --- get ---
    def get(self, key):
        if key not in self.map:
            return -1
        node = self.map[key]
        self._remove(node)              # move to the front:
        self._add_front(node)           # now most recent
        return node.val

    # --- put ---
    def put(self, key, value):
        if key in self.map:             # drop the old node
            self._remove(self.map[key])
        node = Node(key, value)
        self.map[key] = node
        self._add_front(node)
        if len(self.map) > self.cap:
            lru = self.tail.prev        # least recently used
            self._remove(lru)
            del self.map[lru.key]       # why nodes keep keys

# --- use ---
c = LRUCache(2)
c.put(1, "a")
c.put(2, "b")
c.get(1)                        # 'a'; 1 moves to the front
c.put(3, "c")                   # full: evicts 2
c.get(2)                        # -1
`,

class HashMap:
    """Hash table with chaining: bucket = [(key, val)]."""

    def __init__(self, cap=8):
        # one empty chain per bucket
        self.buckets = [[] for _ in range(cap)]
        self.size = 0                   # keys stored

    def _bucket(self, key):
        # hash() -> big int; % folds it into 0..cap-1
        i = hash(key) % len(self.buckets)
        return self.buckets[i]          # the chain to search

    def get(self, key, default=None):
        for k, v in self._bucket(key):  # scan one short chain
            if k == key:                # equal key: found
                return v                # its value
        return default                  # not stored

    def put(self, key, value):
        bucket = self._bucket(key)      # where key belongs
        for i, (k, _) in enumerate(bucket):
            if k == key:                # key already there
                bucket[i] = (key, value)  # overwrite value
                return                  # size unchanged
        bucket.append((key, value))     # new key, may collide
        self.size += 1                  # one more key
        # load factor = keys / buckets; high = long chains
        if self.size / len(self.buckets) > 0.75:
            self._resize()              # grow, O(n) but rare

    def remove(self, key):
        bucket = self._bucket(key)      # where key would be
        for i, (k, _) in enumerate(bucket):
            if k == key:                # found it
                del bucket[i]           # O(chain length)
                self.size -= 1          # one fewer key
                return True             # removed
        return False                    # key was not there

    def _resize(self):
        # take every pair out of the old table
        pairs = [p for b in self.buckets for p in b]
        n = 2 * len(self.buckets)       # double the buckets
        self.buckets = [[] for _ in range(n)]
        self.size = 0                   # put() counts again
        for k, v in pairs:              # re-insert everything:
            self.put(k, v)              # new cap, new index

# --- use it ---
# tiny capacity, to force a resize
m = HashMap(cap=4)
for i, k in enumerate([12, 7, 20, 3, 15]):
    m.put(k, i)                         # hash(int) == int
m.get(20)                               # 2
m.remove(7)                             # True
m.get(7, -1)                            # -1, gone

# --- create ---
class DSU:
    def __init__(self, n):
        self.parent = list(range(n))  # everyone is a root
        self.rank = [0] * n           # rough tree height
        self.count = n                # number of sets

    # --- find: root of x's set ---
    def find(self, x):
        if self.parent[x] != x:
            # path compression: link x straight to the root
            self.parent[x] = self.find(self.parent[x])
        return self.parent[x]

    # --- union: merge two sets ---
    def union(self, a, b):
        ra, rb = self.find(a), self.find(b)
        if ra == rb:
            return False              # same set (a cycle!)
        if self.rank[ra] < self.rank[rb]:
            ra, rb = rb, ra           # ra = the taller tree
        self.parent[rb] = ra          # short under tall
        if self.rank[ra] == self.rank[rb]:
            self.rank[ra] += 1        # equal: grows by one
        self.count -= 1               # two sets became one
        return True

    # --- query ---
    def connected(self, a, b):
        return self.find(a) == self.find(b)

# --- use ---
dsu = DSU(8)
for a, b in [(0, 1), (2, 3), (0, 2), (4, 5), (6, 7), (4, 6)]:
    dsu.union(a, b)
dsu.parent                      # [0, 0, 0, 2, 4, 4, 4, 6]
dsu.count                       # 2
dsu.connected(1, 3)             # True (compresses 3)
dsu.connected(3, 5)             # False
dsu.union(3, 7)                 # True: one set left
dsu.union(1, 5)                 # False: already joined
`,

    dummy = tail = ListNode()   # placeholder before the head
    for v in values:
        tail.next = ListNode(v) # hang a new node off the tail
        tail = tail.next        # tail moves to the new node
    return dummy.next           # real head (None if empty)

    print(node.val)
    node = node.next            # step forward

    out = []
    while head:
        out.append(head.val)
        head = head.next
    return out                  # [3, 7, 1, 9]

# --- length ---
def length(head):
    n = 0
    while head:                 # O(n): no len() for free
        n += 1
        head = head.next
    return n

# --- search ---
def find(head, target):
    # walk until a match or the end
    while head and head.val != target:
        head = head.next
    return head                 # the node, or None

# --- insert ---
head = ListNode(5, head)        # at head, O(1)

def insert_after(node, val):
    # new node takes over node's old next, O(1)
    node.next = ListNode(val, node.next)

def append(head, val):
    if not head:                # empty list: new node is head
        return ListNode(val)
    node = head
    while node.next:            # walk to the last node, O(n)
        node = node.next
    node.next = ListNode(val)
    return head

    prev = dummy
    while prev.next:

            prev.next = prev.next.next

        prev = prev.next
    return dummy.next           # head may have changed

# --- create ---
class Node:
    def __init__(self, val=0):
        self.val = val
        self.prev = self.next = None    # links both ways

class DLL:
    def __init__(self):
        # sentinels: never hold data, never removed
        self.head, self.tail = Node(), Node()
        self.head.next = self.tail      # empty: H <-> T
        self.tail.prev = self.head
        self.size = 0

    # --- insert ---
    def insert_after(self, node, new):
        new.prev, new.next = node, node.next  # hook new in
        node.next.prev = new            # old next points back
        node.next = new                 # node points forward
        self.size += 1

    def push_front(self, new):
        self.insert_after(self.head, new)

    def push_back(self, new):
        self.insert_after(self.tail.prev, new)

    # --- remove ---
    def remove(self, node):             # O(1), no search
        node.prev.next = node.next      # left skips node
        node.next.prev = node.prev      # right skips node
        self.size -= 1
        return node

    def pop_back(self):
        if self.size == 0:
            raise IndexError("pop from empty list")
        return self.remove(self.tail.prev)

    # --- traverse ---
    def __iter__(self):
        node = self.head.next           # first real node
        while node is not self.tail:
            yield node.val
            node = node.next

# --- use ---
dll = DLL()

dll.push_back(Node(4))                  # H <-> 4 <-> T
dll.push_back(a)                        # H <-> 4 <-> 7 <-> T
dll.push_back(Node(2))                  # ... 7 <-> 2 <-> T
dll.remove(a)                           # O(1): we hold a
list(dll)                               # [4, 2]

from collections import deque

# --- create ---
class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left        # left child or None
        self.right = right      # right child or None

# by hand: 1 with children 2 and 3
root = TreeNode(1, TreeNode(2), TreeNode(3))

# from a LeetCode level-order list, None = no child
def build(vals):
    if not vals or vals[0] is None:
        return None
    root = TreeNode(vals[0])
    q = deque([root])           # parents waiting for kids
    i = 1                       # next value to place
    while q and i < len(vals):
        node = q.popleft()
        if vals[i] is not None:     # left child
            node.left = TreeNode(vals[i])
            q.append(node.left)
        i += 1
        # right child (the list may end after a left)
        if i < len(vals) and vals[i] is not None:
            node.right = TreeNode(vals[i])
            q.append(node.right)
        i += 1
    return root

root = build([1, 2, 3, 4, 5, None, 6])

# --- measure ---
def height(node):               # nodes on the longest path
    if not node:
        return 0                # empty tree
    return 1 + max(height(node.left), height(node.right))

def count(node):
    if not node:
        return 0
    return 1 + count(node.left) + count(node.right)

# --- DFS traversals ---
def preorder(n):                # root, left, right
    if not n:
        return []
    return [n.val] + preorder(n.left) + preorder(n.right)

def inorder(n):                 # left, root, right
    if not n:
        return []
    return inorder(n.left) + [n.val] + inorder(n.right)

def postorder(n):               # left, right, root
    if not n:
        return []
    return postorder(n.left) + postorder(n.right) + [n.val]

# preorder  -> [1, 2, 4, 5, 3, 6]
# inorder   -> [4, 2, 5, 1, 3, 6]
# postorder -> [4, 5, 2, 6, 3, 1]

# --- BFS: level order ---
def level_order(root):
    out, q = [], deque([root] if root else [])
    while q:
        level = []
        for _ in range(len(q)):         # exactly one level
            node = q.popleft()
            level.append(node.val)
            # queue the kids that exist
            q.extend(c for c in (node.left, node.right) if c)
        out.append(level)

class TreeNode:

# --- search ---

    return node                 # the node, or None

# --- insert ---
def insert(node, val):

        return TreeNode(val)    # reached an empty spot
    if val < node.val:
        node.left = insert(node.left, val)
    elif val > node.val:

    return node                 # duplicates are ignored

# --- min / max ---
def min_node(node):

    return node
# max: same loop with .right

# --- delete ---
def delete(node, val):

        return None             # value not in the tree
    if val < node.val:
        node.left = delete(node.left, val)
    elif val > node.val:
        node.right = delete(node.right, val)
    else:

        if not node.left:

        if not node.right:
            return node.left
        # case 3: two children -> copy the successor in
        succ = min_node(node.right)  # smallest on the right
        node.val = succ.val
        # then delete the successor from the right subtree
        node.right = delete(node.right, succ.val)
    return node

    return inorder(node.left) + [node.val] + inorder(node.right)

<script>
/* Algorithms · Dynamic Programming */
(function () {

   * Fibonacci: naive / memo / table / two variables

  function fibTree(n, memo) {

def rob(nums):
    if len(nums) == 1:                                 #@one
        return nums[0]
    dp = [0] * len(nums)            # dp[i] = best for 0..i  #@init
    dp[0] = nums[0]                 # only one house  #@b0
    dp[1] = max(nums[0], nums[1])   # the richer of two  #@b1
    for i in range(2, len(nums)):                      #@loop
        # skip house i, or rob it on top of dp[i - 2]
        dp[i] = max(dp[i - 1], dp[i - 2] + nums[i])    #@fill
    return dp[-1]                                      #@done
`,

      const v = (ns, ds, i) => ({ type: 'array', rows: [

        { label: 'dp', items: dp.slice(), states: ds || {}, pointers: i != null ? [{ i, label: 'i' }] : [] },
      ] });

      if (n === 1) {

      dp[0] = nums[0];
      const dim = (from) => dp.map((_, j) => (j >= from ? 'dim' : null));
      t.step('b0', `With one house, rob it: dp[0] = ${nums[0]}.`, { view: v({ 0: 'read' }, Object.assign(dim(1), { 0: 'new' })), vars: { nums, dp } });
      dp[1] = Math.max(nums[0], nums[1]);

def coin_change(coins, amount):
    INF = float('inf')
    # dp[a] = fewest coins that sum to a
    dp = [0] + [INF] * amount                          #@init
    for a in range(1, amount + 1):                     #@loop
        for c in coins:
            if c <= a:                  # coin fits  #@fits
                # last coin c + best way to make a - c
                dp[a] = min(dp[a], dp[a - c] + 1)      #@take
    return dp[amount] if dp[amount] != INF else -1     #@done
`,

    code: `
def lcs(a, b):
    m, n = len(a), len(b)
    # dp[i][j] = LCS length of a[:i] and b[:j]
    dp = [[0] * (n + 1) for _ in range(m + 1)]         #@init
    for i in range(1, m + 1):                          #@row
        for j in range(1, n + 1):
            if a[i - 1] == b[j - 1]:       # chars match  #@cmp
                dp[i][j] = dp[i - 1][j - 1] + 1        #@diag
            else:                          # drop one char
                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])  #@max
    # walk back from the corner to rebuild one LCS
    i, j, out = m, n, []                               #@walk
    while i > 0 and j > 0:                             #@wloop
        if a[i - 1] == b[j - 1]:                       #@bmatch
            out.append(a[i - 1])        # part of the LCS  #@take
            i, j = i - 1, j - 1                        #@move
        elif dp[i - 1][j] >= dp[i][j - 1]:             #@bup
            i -= 1                      # go up  #@up
        else:
            j -= 1                      # go left  #@left
    return ''.join(reversed(out))                      #@done
`,

def min_distance(a, b):
    m, n = len(a), len(b)
    # dp[i][j] = edits to turn a[:i] into b[:j]
    dp = [[0] * (n + 1) for _ in range(m + 1)]         #@init
    for i in range(m + 1):
        dp[i][0] = i                    # delete all i  #@col0
    for j in range(n + 1):
        dp[0][j] = j                    # insert all j  #@row0
    for i in range(1, m + 1):
        for j in range(1, n + 1):
            if a[i - 1] == b[j - 1]:                   #@cmp
                dp[i][j] = dp[i - 1][j - 1]  # free  #@same
            else:
                dp[i][j] = 1 + min(                    #@diff
                    dp[i - 1][j],       # delete a[i-1]
                    dp[i][j - 1],       # insert b[j-1]
                    dp[i - 1][j - 1],   # replace
                )
    return dp[m][n]                                    #@done
`,

      const a = txt(inp.a, 7), b = txt(inp.b, 7);

      const rowLabels = ["''"].concat(a.split(''));
      const colLabels = ["''"].concat(b.split(''));
      let doneCol = false, doneRow = false;
      const g = (ci, cj, extra) => {

          if (r === 0 && c > 0) return doneRow ? null : 'dim';
          if (r === 0 && c === 0) return null;
          return r > ci || (r === ci && c > cj) ? 'dim' : null;

      };
      t.step('init', note + `${m + 1} × ${n + 1} table. Turn ${q(a)} into ${q(b)}.`, { view: g(0, n), vars: { a, b, m, n } });

            st[i + ',' + (j - 1)] = 'read';

  /* =====================================================================

    summary: 'Length of the longest strictly increasing subsequence. The O(n²) DP asks "what is the best run ending here?"; the O(n log n) version keeps the smallest possible tail for every length and binary searches it.',

    notes: [

    variants: [
      {
        id: 'dp-n2',
        label: 'DP O(n²)',
        summary: '`dp[i]` = length of the longest increasing subsequence that **ends at** `nums[i]`. For each earlier `j` with a smaller value, `nums[i]` can extend that run: `dp[i] = max(dp[i], dp[j] + 1)`.',

        code: `
def length_of_lis(nums):
    # dp[i] = longest increasing run that ends at nums[i]
    dp = [1] * len(nums)                # each number alone  #@init
    for i in range(len(nums)):                         #@outer
        for j in range(i):              # every earlier index

        trace(inp) {

from bisect import bisect_left

def length_of_lis(nums):
    # tails[k] = smallest tail of a run of length k + 1
    tails = []                                         #@init
    for x in nums:                                     #@loop

def unique_paths(m, n):
    # dp[r][c] = number of paths from (0, 0) to (r, c)
    dp = [[1] * n for _ in range(m)]   # edges: 1 way  #@init
    for r in range(1, m):                              #@row
        for c in range(1, n):
            # arrive from above or from the left
            dp[r][c] = dp[r - 1][c] + dp[r][c - 1]     #@fill
    return dp[m - 1][n - 1]                            #@done
`,
    trace(inp) {

      const t = DSA.tracer();
      const dp = Array.from({ length: m }, () => new Array(n).fill(1));
      const g = (cr, cc, extra) => {
        const st = cellStates((r, c) => (r > 0 && c > 0 && (r > cr || (r === cr && c > cc)) ? 'dim' : null), m, n);
        return { type: 'grid', title: 'number of paths into each cell', cells: dp.map((r) => r.slice()), rowLabels: U.range(m), colLabels: U.range(n), states: Object.assign(st, extra || {}) };
      };
      const edge = {};
      for (let c = 0; c < n; c++) edge['0,' + c] = 'new';
      for (let r = 0; r < m; r++) edge[r + ',0'] = 'new';
      t.step('init', note + `${m} × ${n} grid filled with 1. The top row and left column really are 1 (only straight moves reach them); the rest gets overwritten.`, { view: g(0, n - 1, edge), vars: { m, n } });
      for (let r = 1; r < m; r++) {
        t.step('row', `Row r = ${r}.`, { view: g(r - 1, n - 1, { ['r' + r]: 'active' }), vars: { m, n, r } });
        for (let c = 1; c < n; c++) {
          dp[r][c] = dp[r - 1][c] + dp[r][c - 1];
          const st = { ['r' + r]: 'active', ['c' + c]: 'active', [r + ',' + c]: 'active', [(r - 1) + ',' + c]: 'read', [r + ',' + (c - 1)]: 'read' };
          t.step('fill', `dp[${r}][${c}] = above ${dp[r - 1][c]} + left ${dp[r][c - 1]} = ${dp[r][c]}.`, { view: g(r, c, st), vars: { m, n, r, c, 'dp[r][c]': dp[r][c] } });
        }
      }
      t.step('done', `Return dp[${m - 1}][${n - 1}] = ${dp[m - 1][n - 1]} path${dp[m - 1][n - 1] === 1 ? '' : 's'}.`, { view: g(m - 1, n - 1, { [(m - 1) + ',' + (n - 1)]: 'found', '0,0': 'path' }), vars: { m, n, return: dp[m - 1][n - 1] } });

    },
  });
})();

<script>
/* Algorithms · Graphs */
(function () {

  // Graph with a sorted adjacency list attached.

  const ek = (g, u, v) => (g.directed ? u + '>' + v : u < v ? u + '-' + v : v + '-' + u);
  // Graph view. o = { ns: {id: state}, es: {edgeKey: state}, badges, ptr, title }
  function gview(g, o) {
    o = o || {};
    const ns = o.ns || {}, es = o.es || {}, bd = o.badges || {};
    const v = {
      type: 'graph',
      directed: !!g.directed,
      nodes: g.nodes.map((n) => {
        const m = { id: n.id, x: n.x, y: n.y };
        if (ns[n.id]) m.s = ns[n.id];
        if (bd[n.id] != null) m.badge = bd[n.id];
        return m;
      }),
      edges: g.edges.map((e) => {
        const m = { from: e.from, to: e.to };
        if (e.w != null) m.w = e.w;
        const s = es[ek(g, e.from, e.to)];
        if (s) m.s = s;
        return m;
      }),
    };

    if (g.height) v.height = g.height;

    if (o.title) v.title = o.title;
    return v;

  // Pointer map from [id, label] pairs (null ids ignored, labels merged).
  function ptrs(pairs) {
    const p = {};

      p[id] = p[id] ? [].concat(p[id], lab) : lab;

  // Python literal of one value / a tuple.
  const pv = (x) => (typeof x === 'string' ? `'${x}'` : x === Infinity ? 'inf' : String(x));

    const head = name + ' = {';
    const pad = ' '.repeat(head.length);

    let cur = head;
    items.forEach((it, i) => {
      const piece = it + (i === items.length - 1 ? '}' : ',');
      const fresh = cur === head || cur === pad;
      if (!fresh && cur.length + 1 + piece.length > 62) { lines.push(cur); cur = pad + piece; }
      else cur += (fresh ? '' : ' ') + piece;
    });

    return lines.join('\n');

  /* ---------- heapq (same list order as CPython) ---------- */
  function lt(a, b) {
    for (let i = 0; i < Math.min(a.length, b.length); i++) {
      if (a[i] < b[i]) return true;
      if (a[i] > b[i]) return false;
    }
    return a.length < b.length;

  function siftdown(h, start, pos) {
    const item = h[pos];
    while (pos > start) {
      const pp = (pos - 1) >> 1;
      if (lt(item, h[pp])) { h[pos] = h[pp]; pos = pp; continue; }
      break;
    }
    h[pos] = item;

      if (r < end && !lt(h[c], h[r])) c = r;
      h[pos] = h[c];
      pos = c;
      c = 2 * pos + 1;
    }
    h[pos] = item;
    siftdown(h, start, pos);

  /* ---------- graphs used on these pages ---------- */

from collections import deque

def bfs(graph, start):
    visited = {start}               # mark when queued  #@init
    queue = deque([start])          # FIFO queue  #@initq
    order = []                      # visit order  #@inito
    while queue:                    # until nothing waits  #@loop
        node = queue.popleft()      # oldest first  #@pop
        order.append(node)          #@visit
        for nei in graph[node]:     # neighbours, sorted

${pyGraph(GB.adj)}

    visited.add(start); queue.push(start);
    step(['init', 'initq', 'inito'], `Mark ${q(start)} visited and put it in the queue. Mark on enqueue so no node is queued twice.`);

      step('loop', queue.length ? `The queue holds ${list(queue)}, so keep going.` : 'The queue is empty: every reachable node has been visited.');

      node = queue.shift(); nei = undefined; act = null;
      order.push(node);
      step(['pop', 'visit'], `Pop ${q(node)} from the front (it waited longest) and add it to \`order\`.`);

      act = null; nei = undefined;
    }
    node = undefined;
    t.step('done', `Return ${list(order)}: nodes in order of distance from ${q(start)} (1 hop, then 2 hops, ...).`, {
      view: gview(g, { ns: Object.fromEntries(order.map((u) => [u, 'visited'])), es: tree }),

      aux: [{ label: 'order', kind: 'list', items: order.slice() }],

from collections import deque

def shortest_path(graph, start, goal):
    parent = {start: None}          # doubles as visited  #@init
    queue = deque([start])          #@initq
    while queue:                    #@loop
        node = queue.popleft()      #@pop
        if node == goal:            # first reach = shortest  #@goal
            break
        for nei in graph[node]:
            if nei not in parent:   #@check
                parent[nei] = node  # we came from node  #@mark
                queue.append(nei)   #@push
    if goal not in parent:          #@reach
        return []                   # unreachable
    path, node = [], goal           #@back0
    while node is not None:         # walk back to start  #@back
        path.append(node)           #@append
        node = parent[node]         #@up
    return path[::-1]               # start -> goal  #@done

${pyGraph(GB.adj)}
shortest_path(graph, 'A', 'G')   # ['A', 'B', 'E', 'G']  #@call
`;

    const g = GB, adj = g.adj, start = 'A', goal = 'G';

    const parent = new Map(), queue = [], popped = new Set(), tree = {};
    let node, nei, act = null, kvHi = null, path, pathSet = new Set(), pathEdges = {};
    const step = (line, msg) => {
      const ns = {};
      parent.forEach((_, u) => (ns[u] = queue.includes(u) ? 'frontier' : popped.has(u) ? 'visited' : 'frontier'));
      pathSet.forEach((u) => (ns[u] = 'path'));
      if (node && !path) ns[node] = 'active';
      const es = Object.assign({}, tree, pathEdges);
      if (act) es[act] = 'active';
      const kvStates = {};
      if (kvHi) kvStates[kvHi[0]] = kvHi[1];
      t.step(line, msg, {
        views: [
          gview(g, { ns, es, ptr: ptrs([[goal, 'goal'], [node, 'node'], [nei, 'nei']]) }),
          { type: 'kv', title: 'parent', entries: [...parent].map(([k, v]) => [k, v == null ? 'None' : v]), states: kvStates },
        ],
        vars: vars({ start, goal, node, nei, path: path ? path.slice() : undefined }),
        aux: [{ label: 'queue', kind: 'queue', items: queue.slice() }],
      });
    };
    step('call', 'Call `shortest_path(graph, \'A\', \'G\')`. Unweighted graph, so BFS finds the path with the fewest edges.');
    parent.set(start, null); queue.push(start); kvHi = [start, 'new'];
    step(['init', 'initq'], `\`parent = {'A': None}\` marks ${q(start)} as seen and remembers where each node came from.`);
    for (;;) {
      kvHi = null;
      step('loop', queue.length ? `Queue: ${list(queue)}.` : 'Queue is empty.');
      if (!queue.length) break;
      node = queue.shift(); popped.add(node); nei = undefined; act = null;
      if (node === goal) {
        step(['pop', 'goal'], `Pop ${q(node)}. It is the goal. BFS reaches nodes in order of distance, so this is the shortest route. Break.`);
        break;
      }
      step(['pop', 'goal'], `Pop ${q(node)}. Not the goal, so look at its neighbours.`);
      for (const n of adj[node]) {
        nei = n; act = ek(g, node, n); kvHi = null;
        const seen = parent.has(n);
        step('check', seen ? `${q(n)} is already in \`parent\`, skip.` : `${q(n)} is new.`);
        if (!seen) {
          parent.set(n, node); queue.push(n); tree[ek(g, node, n)] = 'tree'; kvHi = [n, 'new'];
          step(['mark', 'push'], `\`parent['${n}'] = '${node}'\`: we reached ${q(n)} from ${q(node)}. Queue it.`);
        }
      }
      nei = undefined; act = null;
    }
    nei = undefined; act = null;
    step('reach', `${q(goal)} is in \`parent\`, so it is reachable.`);
    path = []; node = goal;
    step('back0', `Rebuild the path backwards, starting from ${q(goal)}.`);
    for (;;) {
      kvHi = node != null ? [node, 'path'] : null;
      step('back', node != null ? `\`node = '${node}'\`, not None: keep walking.` : '`node` is None: we walked past the start.');
      if (node == null) break;
      path.push(node); pathSet.add(node);
      const p = parent.get(node);
      step(['append', 'up'], p != null ? `Append ${q(node)}. Its parent is ${q(p)}, step back there.` : `Append ${q(node)}. It is the start, its parent is None.`);
      if (p != null) pathEdges[ek(g, node, p)] = 'path';
      node = p;
    }
    node = undefined;
    const res = path.slice().reverse();
    t.step('done', `Reverse it: ${list(res)}. ${res.length - 1} edges, the fewest possible.`, {
      views: [
        gview(g, { ns: Object.fromEntries([...parent.keys()].map((u) => [u, pathSet.has(u) ? 'path' : 'visited'])), es: Object.assign({}, tree, pathEdges) }),
        { type: 'kv', title: 'parent', entries: [...parent].map(([k, v]) => [k, v == null ? 'None' : v]), states: Object.fromEntries([...pathSet].map((u) => [u, 'path'])) },
      ],
      vars: { start, goal, path: path.slice(), return: res },
    });
    return t.frames;
  }
